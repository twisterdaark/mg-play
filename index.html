    victim: { t: 'المجني عليه', goal: 'المتهم ياخد حكم.', tips: ['احكي اللي حصلك بحرقة وتفاصيل، حتى لو بتألّف شوية.', 'دوّر على أي تناقض في كلام المتهم.'] },
    defense: { t: 'محامي الدفاع', goal: 'تطلّع المتهم براءة.', tips: ['قول «عندي دليل!» والقاضي يطلّعلك دليل عشوائي… والشطارة في تفسيره لصالحك.', 'قول «اعتراض!» كل ما الادعاء يزوّدها.'] },
    prosecutor: { t: 'وكيل النيابة', goal: 'تثبت التهمة على المتهم.', tips: ['قول «عندي دليل!» والقاضي يطلّعلك دليل عشوائي… والشطارة في تفسيره لصالحك.', 'اسأل الشهود أسئلة تحرج الدفاع.'] },
    witness: { t: 'شاهد', goal: '', tips: ['احكي شهادتك بثقة وزوّد تفاصيل من عندك.', 'محدش يعرف إنت في صف مين… خليها كده لحد الآخر.'] },
    journalist: { t: 'الصحفي', goal: 'تقلب الجلسة بأخبارك العاجلة. بتكسب لو نشرت خبر واحد على الأقل.', tips: ['معاك خبرين عاجلين تنشرهم وقت ما تحب.', 'الخبر بيتحسب دليل… فخليه يلخبط الكل.'] },
  };
  const SIDE_OF = { defendant: 'def', defense: 'def', victim: 'pros', prosecutor: 'pros' };
  const sideName = (s) => (s === 'pros' ? 'الادعاء' : s === 'def' ? 'الدفاع' : '');
  // «مين مين في المحكمة»: what everyone at the table may know about each role (never a side, a truth or a mission)
  const ROLE_PUBLIC = {
    judge: 'بيدير الجلسة، ويدي الكلمة، ويطلّع الأدلة. وفي الآخر هو اللي بيحكم.',
    defendant: 'متهم، ولسه محدش أثبت عليه حاجة. بيدافع عن نفسه، ومحدش غيره يعرف هو عملها فعلًا ولا لأ.',
    victim: 'صاحب الشكوى. بيحكي اللي حصله، وعايز المتهم ياخد حكم.',
    prosecutor: 'في صف الادعاء: بيحاول يثبت التهمة على المتهم.',
    defense: 'في صف الدفاع: بيحاول يطلّع المتهم براءة.',
    witness: 'بيحكي اللي شافه. ومحدش يعرف هو في صف مين.',
    journalist: 'بيغطي الجلسة، ومعاه أخبار عاجلة ينشرها وقت ما يحب.',
  };
  const WHOIS_ORDER = ['judge', 'defendant', 'victim', 'prosecutor', 'defense', 'witness', 'journalist'];
  // players: [{name, role}] (the public part only)
  function whoIsWhoHTML(players, head) {
    const rank = (r) => { const i = WHOIS_ORDER.indexOf(r); return i < 0 ? 99 : i; };
    const list = players.map((p, i) => ({ p, i })).filter((x) => x.p.role).sort((a, b) => rank(a.p.role) - rank(b.p.role) || a.i - b.i);
    return `
      <article class="paper">
        <div class="report-head"><span>${head ? esc(head) : 'مين مين في المحكمة'}</span><b>${list.length} لاعبين</b></div>
        <ol class="cast whois">${list.map(({ p }) => `<li><div class="pn">${esc(p.name)}</div><div class="cn">${(ROLE[p.role] || ROLE.witness).t}</div><p>${esc(ROLE_PUBLIC[p.role] || '')}</p></li>`).join('')}</ol>
      </article>`;
  }
  const WHOIS_NOTE = 'المتهم متهم وبس: محدش يعرف لسه هو عملها فعلًا ولا لأ، والجلسة هي اللي هتكشف. والشهود محدش يعرف هما في صف مين. وكل واحد معاه مهمة سرية.';

  // ---------- cases: built-in (coherent) or typed by the players (filled templates) ----------
  // templates say "{place}" right after a noun ("شبشب لاقيينه {place}"), so a typed place needs its preposition
  const PLACE_PREP = /^(في|فى|ف|على|علي|ع|جوه|جوا|جنب|عند|قدام|ورا|تحت|فوق|بره|برا|من|بين|حوالين|ناحية|وسط)\s|^(بال|فال|عال)/;
  const placeText = (p) => { p = String(p || '').trim(); return !p ? 'هناك' : PLACE_PREP.test(p) ? p : `في ${p}`; };
  const COURT_DEFAULTS = { thing: 'الموضوع', time: 'ساعتها', charge: 'التهمة' };
  function courtFill(str, ctx) {
    return String(str || '').replace(/\{(defendant|victim|thing|place|time|charge)\}/g, (m, k) => {
      const v = ctx[k] != null ? String(ctx[k]).trim() : '';
      if (k === 'place') return placeText(v);
      return v || COURT_DEFAULTS[k] || '…';
    });
  }
  function randomCourtCase(kidsOnly) {
    const pool = COURT.cases.filter((c) => !kidsOnly || c.kids);
    const c = pickOne(pool.length ? pool : COURT.cases);
    return Object.assign({ custom: false }, c);
  }
  function blankCustomCase() {
    return { custom: true, title: 'قضية من تأليفكم', charge: '', thing: '', place: '', time: '', victimLabel: '' };
  }
  function caseMaterial(c, ctx) {
    const T = COURT.templates || {};
    const f = (arr) => (arr || []).map((s) => courtFill(s, ctx));
    const src = c.custom ? { evidence: T.evidence, witnessFacts: T.witnessFacts, truthGuilty: T.truthGuilty, truthInnocent: T.truthInnocent, twists: T.twists } : c;
    const or = (a, b) => (a && a.length ? a : b);
    return {
      evidence: f(src.evidence).concat(COURT.genericEvidence || []),
      facts: or(f(src.witnessFacts), [courtFill('حد كان قريب من {thing} {time} وبيبص حواليه', ctx)]),
      guilty: or(f(src.truthGuilty), ['الحقيقة: الجريمة حصلت على إيدك… ومحدش لازم يعرف.']),
      innocent: or(f(src.truthInnocent), ['الحقيقة: إيدك نضيفة تمامًا، بس عندك سر محرج مش عايزه يبان.']),
      twists: or(f(src.twists), [courtFill('مفاجأة: فيه شاهد جديد بيقول إنه شاف {thing} في مكان تاني خالص', ctx)]),
    };
  }
  const caseLine = (c) => [c.charge, (c.place || '').trim() && placeText(c.place), c.time].filter(Boolean).join(' ');
  const customValid = (c) => (c.charge || '').trim().length >= 6 && (c.thing || '').trim().length >= 2;

  // library of the players' own cases
  const libAll = () => store.get(COURT_LIB) || [];
  function libSave(c) {
    const all = libAll().filter((x) => !(x.charge === c.charge && x.thing === c.thing));
    all.unshift({ id: 'lib' + Date.now().toString(36), charge: c.charge.trim(), thing: c.thing.trim(), place: (c.place || '').trim(), time: (c.time || '').trim(), victimLabel: (c.victimLabel || '').trim() });
    store.set(COURT_LIB, all.slice(0, 50));
  }
  function libHTML(pickAct) {
    const all = libAll();
    if (!all.length) return '<p class="empty">لسه مفيش قضايا محفوظة. اكتبوا قضية ودوسوا «احفظها في المكتبة».</p>';
    return `<div class="choices">${all.map((c) => `
      <div class="choice" style="flex-direction:column;align-items:stretch">
        <span class="pn" style="font-size:16px">${esc(c.charge)}</span>
        <span class="cn" style="text-align:start">${esc([c.thing && `الحاجة: ${c.thing}`, c.place, c.time].filter(Boolean).join(' · '))}</span>
        <span class="row"><button class="btn primary sm" data-act="${pickAct}" data-arg="${esc(c.id)}">العبوها</button><button class="btn ghost sm" data-act="libAskDelete" data-arg="${esc(c.id)}">امسحها</button></span>
      </div>`).join('')}</div>`;
  }
  function customCaseFields(c, key) {
    const inp = (k, label, ph, max) => `<div class="field"><label for="${key}-${k}">${label}</label><input id="${key}-${k}" data-${key}="${k}" maxlength="${max}" value="${esc(c[k] || '')}" placeholder="${ph}"></div>`;
    return inp('charge', 'التهمة (حصل إيه؟)', 'مثلًا: استلاف الشاحن ومرجعهوش', 120)
      + inp('thing', 'الحاجة المهمة في القضية', 'مثلًا: الشاحن', 40)
      + inp('victimLabel', 'المجني عليه مين؟', 'مثلًا: صاحب الشاحن', 40)
      + inp('place', 'فين؟ (اختياري)', 'مثلًا: في أوضة المعيشة', 60)
      + inp('time', 'إمتى؟ (اختياري)', 'مثلًا: امبارح بالليل', 60)
      + '<p class="lede small">«الحاجة المهمة» دي هي اللي هتتبني عليها الأدلة وكلام الشهود والأسرار، عشان كل حاجة تمشي مع قضيتكم.</p>';
  }

  // ---------- "help me speak" lines ----------
  const PHASE_HINTS = { open: ['judge'], prosOpen: ['prosOpen'], defOpen: ['defOpen'], wit: ['witnessPros', 'witnessDef'], accused: ['accused'], victimTalk: ['victim'], closing: ['closingPros', 'closingDef'] };
  const ROLE_HINTS = { judge: ['judge', 'question'], defendant: ['accused'], victim: ['victim', 'question'], prosecutor: ['prosOpen', 'closingPros', 'question'], defense: ['defOpen', 'closingDef', 'objection'], journalist: ['journalist'] };
  // skip help lines that call on a role nobody plays at this table
  function hintFits(s, ctx) {
    const R = ctx && ctx.roles;
    if (!R) return true;
    return !((/الشهود|شاهد/.test(s) && !R.includes('witness')) || (/الصحفي/.test(s) && !R.includes('journalist'))
      || (/وكيل النيابة|النيابة/.test(s) && !R.includes('prosecutor')) || (/محامي الدفاع/.test(s) && !R.includes('defense')));
  }
  function hintPick(keys, n, ctx, keep) {
    const pool = [].concat(...keys.map((k) => (COURT.hints && COURT.hints[k]) || [])).filter((s) => (!keep || keep(s)) && hintFits(s, ctx));
    return pickN(pool, n).map((s) => courtFill(s, ctx));
  }
  // the judge's pool mixes opening lines and last questions: the opening shows «الجلسة مفتوحة» first and no "before the verdict" lines
  function phaseLines(phaseId, n, ctx) {
    const keys = PHASE_HINTS[phaseId] || ['question'];
    if (phaseId !== 'open') return hintPick(keys, n, ctx, phaseId === 'closing' ? null : (s) => !/قبل الحكم/.test(s));
    const opener = hintPick(keys, 1, ctx, (s) => /مفتوحة/.test(s));
    return opener.concat(hintPick(keys, n - opener.length, ctx, (s) => !/مفتوحة|قبل الحكم|آخر سؤال/.test(s)));
  }
  function hintsModal(title, sections) {
    const body = sections.filter((s) => s.lines.length).map((s) => `<h3 style="font:700 14px var(--f-ui);color:var(--lamp);margin-top:6px">${s.t}</h3><ul class="qs">${s.lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>`).join('');
    modal = { title, html: body || '<p>مفيش اقتراحات دلوقتي.</p>', actions: [{ label: 'اقتراحات تانية', act: modal && modal.again ? modal.again : 'closeModal' }, { label: 'تمام', act: 'closeModal', cls: 'primary' }] };
  }
  function phaseHintSections(phaseId, ctx) {
    return [
      { t: 'كلام ممكن يتقال دلوقتي', lines: phaseLines(phaseId, 3, ctx) },
      { t: 'أسئلة تحرج', lines: hintPick(['question'], 2, ctx) },
      { t: 'لو طلعلك دليل', lines: hintPick(['evidence'], 2, ctx) },
      { t: 'اعتراض', lines: hintPick(['objection'], 1, ctx) },
    ];
  }
  function roleHintSections(role, side, phaseId, ctx) {
    const keys = role === 'witness' ? [side === 'pros' ? 'witnessPros' : 'witnessDef'] : (ROLE_HINTS[role] || ['question']);
    return [
      { t: 'كلام يناسب دورك', lines: hintPick(keys, 3, ctx) },
      { t: 'في المرحلة دي', lines: PHASE_HINTS[phaseId] && (phaseId !== 'open' || role === 'judge') ? phaseLines(phaseId, 2, ctx) : [] },
      { t: 'أسئلة تحرج', lines: role === 'judge' || role === 'journalist' ? [] : hintPick(['question'], 1, ctx) },
      { t: 'لو طلعلك دليل', lines: SIDE_OF[role] ? hintPick(['evidence'], 1, ctx) : [] },
    ];
  }

  // ---------- phases (shared by both ways of playing) ----------
  function buildPhases(players) {
    const nm = (role) => { const p = players.find((x) => x.role === role); return p ? p.name : ''; };
    const speaker = (side) => (side === 'pros' ? (nm('prosecutor') || nm('victim')) : (nm('defense') || nm('defendant')));
    const P = [{ id: 'open', t: 'افتتاح الجلسة', who: nm('judge'), note: 'القاضي يقرا القضية بصوت عالي ويفتتح الجلسة.', time: 0 }];
    P.push({ id: 'prosOpen', t: 'كلمة الادعاء', who: speaker('pros'), note: 'الادعاء يحكي اللي حصل ويتهم المتهم.', time: 90 });
    P.push({ id: 'defOpen', t: 'كلمة الدفاع', who: speaker('def'), note: 'الدفاع يرد ويحكي روايته.', time: 90 });
    players.forEach((p) => { if (p.role === 'witness') P.push({ id: 'wit', t: `شهادة ${p.name}`, who: p.name, note: 'الشاهد يحكي اللي شافه، وبعدين الطرفين يسألوه.', time: 90 }); });
    P.push({ id: 'accused', t: 'استجواب المتهم', who: nm('defendant'), note: 'القاضي والادعاء يسألوا المتهم، والمتهم يدافع عن نفسه.', time: 90 });
    if (nm('prosecutor')) P.push({ id: 'victimTalk', t: 'كلمة المجني عليه', who: nm('victim'), note: 'المجني عليه يحكي حصل له إيه بالظبط.', time: 60 });
    P.push({ id: 'closing', t: 'المرافعة الختامية', who: `${speaker('pros')} ثم ${speaker('def')}`, note: 'كل طرف ياخد آخر كلمة قبل الحكم.', time: 60 });
    return P;
  }
  // a mission that names a role only goes to someone else, and only when that role is at the table
  function missionFits(m, role, present) {
    const has = (r) => present.has(r) && role !== r;
    if (/الصحفي|الخبر العاجل/.test(m) && !has('journalist')) return false;
    if (/القاضي/.test(m) && role === 'judge') return false;
    if (/وكيل النيابة/.test(m) && !has('prosecutor')) return false;
    if (/محامي الطرف التاني/.test(m)) return present.has('defense') && present.has('prosecutor') && ['defendant', 'victim', 'defense', 'prosecutor'].includes(role);
    if (/المحامي/.test(m) && !has('defense')) return false;
    return true;
  }
  function assignCourtRoles(names, judgeIdx) {
    const n = names.length;
    const others = shuffle(Array.from({ length: n }, (_, i) => i).filter((i) => i !== judgeIdx));
    const roles = ROLE_ORDER.slice(0, n - 1);
    const present = new Set(['judge', ...roles]);
    const pool = shuffle(COURT.missions.slice());
    let wSide = rand(2) ? 'pros' : 'def';
    return names.map((name, i) => {
      const role = i === judgeIdx ? 'judge' : roles[others.indexOf(i)];
      const k = pool.findIndex((m) => missionFits(m, role, present));
      const mission = k >= 0 ? pool.splice(k, 1)[0] : pickOne(COURT.missions);
      const p = { name, role, mission };
      if (p.role === 'witness') { p.side = wSide; wSide = wSide === 'pros' ? 'def' : 'pros'; }
      return p;
    });
  }
  function dealSecrets(players, c, guilty) {
    const nm = (role) => { const p = players.find((x) => x.role === role); return p ? p.name : ''; };
    const ctx = { defendant: nm('defendant'), victim: nm('victim'), thing: c.thing, place: c.place, time: c.time, charge: c.charge, roles: [...new Set(players.map((p) => p.role))] };
    const M = caseMaterial(c, ctx);
    const facts = shuffle(M.facts.slice());
    let k = 0;
    players.forEach((p) => { if (p.role === 'witness') p.fact = facts[k++ % facts.length]; });
    return { ctx, M, truth: pickOne(guilty ? M.guilty : M.innocent) };
  }
  function drawEvidence(M, used) {
    const fresh = M.evidence.filter((e) => !used.has(e));
    return pickOne(fresh.length ? fresh : M.evidence);
  }
  function courtScore(players, verdict, guilty, evidence, done) {
    const side = verdict === 'guilty' ? 'pros' : 'def';
    const judgeRight = (verdict === 'guilty') === guilty;
    const newsUsed = (evidence || []).some((e) => e.side === 'news');
    return players.map((p, i) => {
      const s = p.role === 'witness' ? p.side : SIDE_OF[p.role];
      const win = p.role === 'judge' ? judgeRight : p.role === 'journalist' ? newsUsed : s ? s === side : false;
      const mission = !!(done && done[i]);
      return { win, mission, judgeRight: p.role === 'judge' && judgeRight, pts: (win ? 2 : 0) + (mission ? 1 : 0) };
    });
  }
  function saveCourtStats(players, W) {
    const all = dict(COURT_STATS);
    players.forEach((p, i) => {
      const k = p.name.trim();
      const r = all[k] || { games: 0, wins: 0, points: 0, missions: 0, judgeRight: 0 };
      r.games++; if (W[i].win) r.wins++; if (W[i].mission) r.missions++; if (W[i].judgeRight) r.judgeRight++;
      r.points += W[i].pts;
      all[k] = r;
    });
    store.set(COURT_STATS, all);
  }
  const ptsLabel = (pts) => (pts === 0 ? 'صفر' : pts === 1 ? 'نقطة' : pts === 2 ? 'نقطتين' : `${pts} نقط`);

  // =====================================================================
  // ---------- one phone ----------
  const idxOf = (role) => S.cPlayers.findIndex((p) => p.role === role);
  const nameOf = (role) => { const i = idxOf(role); return i < 0 ? '' : S.cPlayers[i].name; };
  function speakerFor(side) { return side === 'pros' ? (nameOf('prosecutor') || nameOf('victim')) : (nameOf('defense') || nameOf('defendant')); }
  const oneCtx = () => ({ defendant: nameOf('defendant'), victim: nameOf('victim'), thing: S.cCase.thing, place: S.cCase.place, time: S.cCase.time, charge: S.cCase.charge, roles: [...new Set((S.cPlayers || []).map((p) => p.role))] });

  screens.cSetup = () => {
    const n = S.n;
    const list = Array.from({ length: n }, (_, i) => `
      <label for="cname-${i}"><span class="n">${i + 1}</span>
        <input id="cname-${i}" data-cname="${i}" type="text" maxlength="18" autocomplete="off" placeholder="اسم اللاعب ${i + 1}" value="${esc(S.names[i] || '')}">
      </label>`).join('');
    const saved = store.get(COURT_SAVE);
    return `
    <div class="screen">
      <div class="topbar"><button class="iconbtn" data-act="go" data-arg="modes">رجوع</button><span class="t">المحكمة</span></div>
      <div class="seg" role="group" aria-label="طريقة اللعب">
        <button class="on" aria-pressed="true">على موبايل واحد</button>
        <button data-act="openMp">كل واحد على موبايله</button>
      </div>
      ${saved && saved.cPlayers ? `<div class="resume"><div><div class="eyebrow">فيه جلسة لسه شغالة</div><b>${esc(saved.cCase ? saved.cCase.charge : '')}</b></div>
        <div class="row"><button class="btn primary" data-act="cResume">كمّلها</button><button class="btn ghost" data-act="cDiscard">امسحها</button></div></div>` : ''}
      <div><h1 class="h2">المحكمة</h1><p class="lede">قضية مضحكة، ومحامين بيرتجلوا، وأدلة عشوائية، وقاضي بيحكم. من 3 لـ 10 لاعبين.</p></div>
      <details class="prev"><summary>إزاي نلعب المحكمة؟</summary><ol class="qs">
        <li>اكتبوا أساميكم، واللعبة توزّع الأدوار: قاضي، ومتهم، ومجني عليه، ومع زيادة العدد: محامين، وشهود، وصحفي.</li>
        <li>اللعبة بتطلّع قضية جاهزة، أو تكتبوا قضيتكم بنفسكم وتحفظوها في المكتبة.</li>
        <li>كل واحد بيشوف سره لوحده: الشهود في صف مين، والمتهم عملها ولا لأ، ومهمة سرية مضحكة.</li>
        <li>الموبايل بيفضل مع القاضي: بيدي الكلمة بالدور، ولما حد يقول «عندي دليل!» بيطلّعله دليل عشوائي لازم يفسّره لصالحه. ولو حد مش عارف يقول إيه، يدوس «ساعدني أتكلم».</li>
        <li>في الآخر القاضي بيحكم. الطرف الكسبان بياخد نقطتين، والقاضي بياخدهم لو حكمه طلع صح، واللي نفّذ مهمته السرية بياخد نقطة.</li>
      </ol></details>
      <div class="stepper">
        <button data-act="cStep" data-arg="-1" aria-label="قلّل" ${n <= 3 ? 'disabled' : ''}>−</button>
        <output class="bump" aria-live="polite">${n}</output>
        <button data-act="cStep" data-arg="1" aria-label="زوّد" ${n >= 10 ? 'disabled' : ''}>+</button>
      </div>
      <p class="lede small" style="text-align:center">${courtRolesPreview(n)}</p>

  function caseCardHTML(c, names) {

  function secretCardHTML(p, truth, guilty) {

  screens.cRole = () => {
    const p = S.cPlayers[S.revealIdx];
    const R = ROLE[p.role];
    const culprit = p.role === 'defendant';
    return `
    <div class="screen">

  // after the last secret: the whole table hears who is who (read out loud), then the trial starts
  screens.cCast = () => `
    <div class="screen">
      <div class="topbar"><span class="t">قضية رقم ${S.cNo}</span><button class="iconbtn" data-act="cMenu">القائمة</button></div>
      <div><h1 class="h2">كله شاف سره. دلوقتي مين مين؟</h1><p class="lede">حطوا الموبايل في النص، وحد يقرا الأسامي دي بصوت عالي عشان كل واحد يعرف هيكلم مين.</p></div>
      ${whoIsWhoHTML(S.cPlayers)}
      <div class="ghostnote">${WHOIS_NOTE}</div>
      <div class="actionbar"><button class="btn primary" data-act="cBegin">يلا نبدأ الجلسة</button></div>
    </div>`;

  function evidenceLogHTML(ev) {
    if (!ev.length) return '';
    const label = (e) => (e.side === 'news' ? 'خبر عاجل' : e.side === 'twist' ? 'مفاجأة' : sideName(e.side));
    // twist/news texts usually carry their own «مفاجأة:» / «عاجل:» prefix already
    const line = (e) => (/^(مفاجأة|عاجل)\s*:/.test(e.text) ? esc(e.text) : `<b>${label(e)}:</b> ${esc(e.text)}`);
    return `<details class="prev" open><summary>سجل الجلسة (${ev.length})</summary><ol>${ev.map((e) => `<li>${line(e)}</li>`).join('')}</ol></details>`;
  }

  screens.cTrial = () => {
    const ph = S.cPhases[S.cPhase];
    const total = S.cPhases.length;
    const ev = S.cEvidence || [];
    const left = (side) => EVIDENCE_PER_SIDE - ev.filter((e) => e.side === side).length;
    const jIdx = idxOf('journalist');
    const newsLeft = NEWS_PER_JOURNALIST - ev.filter((e) => e.side === 'news').length;
    const twistLeft = TWISTS_PER_TRIAL - ev.filter((e) => e.side === 'twist').length;
    const pips = Array.from({ length: total }, (_, i) => `<i class="${i < S.cPhase ? 'done' : i === S.cPhase ? 'now' : ''}"></i>`).join('');
    return `
    <div class="screen">
      <div class="topbar"><span class="t">قضية رقم ${S.cNo} · القاضي ${esc(nameOf('judge'))}</span><button class="iconbtn" data-act="cMenu">القائمة</button></div>
      <div>
        <div class="night-head"><h1 class="h-display" style="font-size:36px">${esc(ph.t)}</h1><span class="of">${S.cPhase + 1} من ${total}</span></div>
        <div class="pips" aria-hidden="true">${pips}</div>
      </div>
      <article class="paper slip">
        <div class="report-head"><span>الكلمة لـ</span><b>${esc(ph.who)}</b></div>
        <p class="hint">${esc(ph.note)}</p>
        ${ph.id === 'open' ? `<p class="hint"><b>القضية:</b> المتهم ${esc(nameOf('defendant'))}، والتهمة ${esc(caseLine(S.cCase))}. المجني عليه: ${esc(nameOf('victim'))}${S.cCase.victimLabel ? ` (${esc(S.cCase.victimLabel)})` : ''}.</p>` : ''}
      </article>
      <div class="court-tools">
        <button class="btn ghost sm" data-act="cHelp">ساعدني أتكلم</button>
        <button class="btn ghost sm" data-act="cWhoIs">مين مين؟</button>
      </div>
      ${ph.time > 0 && SET.time > 0 ? `
      <section class="timerbox" aria-label="وقت الكلام">
        <div class="timer ${T.left === 0 ? 'over' : ''}" id="timer" role="timer">${mmss(T.left)}</div>
        <div class="tctl"><button data-act="timerToggle" id="timer-btn">${T.running ? 'وقّف' : T.left === T.total ? 'ابدأ' : 'كمّل'}</button><button data-act="timerAdd">+30 ث</button></div>
      </section>` : ''}
      <div class="court-tools">
        <button class="btn ghost sm side-pros" data-act="cEvidence" data-arg="pros" ${left('pros') > 0 ? '' : 'disabled'}>دليل للادعاء (${left('pros')})</button>
        <button class="btn ghost sm side-def" data-act="cEvidence" data-arg="def" ${left('def') > 0 ? '' : 'disabled'}>دليل للدفاع (${left('def')})</button>
      </div>
      <div class="court-tools">
        <button class="btn danger sm" data-act="cObjection">اعتراض!</button>
        <button class="btn ghost sm" data-act="cTwist" ${twistLeft > 0 ? '' : 'disabled'}>مفاجأة في القضية (${twistLeft})</button>
      </div>
      ${jIdx >= 0 ? `<button class="btn ghost sm" data-act="cNews" ${newsLeft > 0 ? '' : 'disabled'}>خبر عاجل من الصحفي ${esc(nameOf('journalist'))} (${newsLeft})</button>` : ''}
      ${evidenceLogHTML(ev)}
      <div class="actionbar">
        ${S.cPhase < total - 1 ? `<button class="btn primary" data-act="cNext">التالي: ${esc(S.cPhases[S.cPhase + 1].t)}</button>` : '<button class="btn primary" data-act="go" data-arg="cVerdict">رُفعت الجلسة للمداولة</button>'}
      </div>
    </div>`;
  };

  function verdictPanelHTML(v, sentence, actPrefix) {
    return `
      <div class="court-tools">
        <button class="btn ${v === 'guilty' ? 'danger' : 'ghost'}" data-act="${actPrefix}Verdict" data-arg="guilty">مذنب</button>
        <button class="btn ${v === 'innocent' ? 'primary' : 'ghost'}" data-act="${actPrefix}Verdict" data-arg="innocent">براءة</button>
      </div>
      ${v === 'guilty' ? `
      <article class="paper slip"><div class="report-head"><span>العقوبة</span><b>حكم نهائي</b></div><p class="hint">${esc(sentence)}</p></article>
      <button class="btn ghost sm" data-act="${actPrefix}Sentence">عقوبة تانية</button>` : ''}`;
  }
  screens.cVerdict = () => `
    <div class="screen">
      <div class="topbar"><span class="t">المداولة</span><button class="iconbtn" data-act="cMenu">القائمة</button></div>
      <div><h1 class="h2">يا حضرة القاضي ${esc(nameOf('judge'))}…</h1><p class="lede">فكّر كويس. المتهم عملها ولا لأ؟</p></div>
      ${verdictPanelHTML(S.cVerdict, S.cSentence, 'cSet')}
      <div class="actionbar"><button class="btn primary" data-act="cAnnounce" ${S.cVerdict ? '' : 'disabled'}>انطق بالحكم</button></div>
    </div>`;

  function endHTML(o) {
    const guilty = o.verdict === 'guilty';
    return `
      <article class="paper">
        <div class="end-head">
          <span class="stamp big thud ${guilty ? 'blood' : ''}">${guilty ? 'مذنب' : 'براءة'}</span>
          <h1 class="h-display">${guilty ? 'حكمت المحكمة' : 'المتهم خرج براءة'}</h1>
          ${guilty ? `<p style="font-family:var(--f-ui);color:var(--ink-soft)">العقوبة: ${esc(o.sentence)}</p>` : ''}
        </div>
      </article>
      <article class="paper">
        <div class="report-head"><span>الحقيقة</span><b>${esc(o.defendant)}</b></div>
        <p class="hint"><b>${o.guilty ? 'المتهم كان عملها فعلًا!' : 'المتهم كان بريء فعلًا!'}</b> ${esc(o.truth)}</p>
        <p class="hint">${o.judgeRight ? `حكم القاضي ${esc(o.judge)} طلع صح.` : `حكم القاضي ${esc(o.judge)} طلع غلط… المتهم ضحك على المحكمة.`}</p>
        ${o.players.filter((p) => p.role === 'witness').map((p) => `<p class="small" style="font-family:var(--f-ui)">${esc(p.name)} كان شاهد ${p.side === 'pros' ? 'إثبات' : 'نفي'}.</p>`).join('')}
      </article>
      <section class="setgroup">
        <h2 style="font:700 18px var(--f-ui)">المهمات السرية: مين نفّذ مهمته؟</h2>
        <p class="lede small">${o.canMark ? 'كل واحد يقرا مهمته بصوت عالي، والكل يحكم. دوسوا على اللي نفّذ.' : 'القاضي بيعلّم على اللي نفّذ مهمته.'}</p>
        <div class="choices">${o.players.map((p, i) => `
          <button class="choice ${o.done && o.done[i] ? 'on' : ''}" ${o.canMark ? `data-act="${o.markAct}" data-arg="${i}"` : 'disabled'}>
            <span class="pn">${esc(p.name)}</span><span class="cn">${esc((p.mission || '').replace('مهمتك السرية: ', ''))}</span>
          </button>`).join('')}</div>
      </section>
      <article class="paper">
        <div class="report-head"><span>النقط</span><b>كسب ${o.W.filter((w) => w.win).length}</b></div>
        <ol class="cast">${o.players.map((p, i) => `<li><div class="pn">${esc(p.name)}</div><div class="cn">${ROLE[p.role].t} <span>· ${o.W[i].win ? 'كسب' : 'خسر'}${o.W[i].mission ? ' · نفّذ مهمته' : ''}</span></div><span class="stamp sm">${ptsLabel(o.W[i].pts)}</span></li>`).join('')}</ol>
      </article>`;
  }
  screens.cEnd = () => {
    const W = courtScore(S.cPlayers, S.cVerdict, S.cGuilty, S.cEvidence, S.cDone);
    return `
    <div class="screen">
      ${endHTML({ verdict: S.cVerdict, sentence: S.cSentence, guilty: S.cGuilty, truth: S.cTruth, defendant: nameOf('defendant'), judge: nameOf('judge'), judgeRight: (S.cVerdict === 'guilty') === S.cGuilty, players: S.cPlayers, done: S.cDone, W, canMark: true, markAct: 'cToggleMission' })}
      <div class="actionbar">
        <button class="btn primary" data-act="cSave">سجّل النقط وقضية جديدة بنفس الناس</button>
        <button class="btn ghost" data-act="cQuit">رجوع لطرق اللعب</button>
      </div>
    </div>`;
  };

  function startCourt(names) {
    const judge = S.judgeMode === 'pick' && S.judgePick != null && S.judgePick < names.length ? S.judgePick : rand(names.length);
    S = {
      screen: 'cCase', mode: 'court', names: names.slice(), judgeMode: S.judgeMode, judgePick: S.judgePick, kidsOnly: !!S.kidsOnly,
      cPlayers: assignCourtRoles(names, judge), cCase: randomCourtCase(!!S.kidsOnly), cNo: 100 + rand(900), cGuilty: rand(2) === 0, cTruth: '',
      revealIdx: 0, revealed: false, cPhase: 0, cPhases: [], cEvidence: [], cVerdict: null, cSentence: pickOne(COURT.sentences), cDone: {},
    };
    store.set(NAMES_KEY, names);
    render();
  }

  const COURT_ACTS = {
    openCourt() {
      const remembered = store.get(NAMES_KEY) || [];
      S = { screen: 'cSetup', mode: 'court', n: clamp(remembered.length || 4, 3, 10), names: remembered.slice(), judgeMode: 'random', judgePick: null, kidsOnly: false };
      render();
    },
    cStep(d) { S.n = clamp(S.n + Number(d), 3, 10); render(); },
    cJudgeMode(m) { S.judgeMode = m; render(); },
    cPickJudge(i) { S.judgePick = Number(i); render(); },
    cKids(v) { S.kidsOnly = v === 'kids'; render(); },
    cStart() {
      const names = Array.from({ length: S.n }, (_, i) => (S.names[i] || '').trim());
      const err = document.getElementById('cnames-err');
      const empty = names.findIndex((x) => !x);
      if (empty >= 0) { err.textContent = `اكتب اسم اللاعب ${empty + 1}.`; return; }
      if (new Set(names.map((x) => x.toLowerCase())).size !== names.length) { err.textContent = 'في اسمين زي بعض. فرّقوا بينهم.'; return; }
      if (S.judgeMode === 'pick' && (S.judgePick == null || S.judgePick >= S.n)) { err.textContent = 'اختاروا مين القاضي.'; return; }
      startCourt(names);
    },
    cReroll() { S.cCase = randomCourtCase(S.kidsOnly); SND.play('page'); render(); },
    cEdit() { S.cCase = S.cCase.custom ? S.cCase : blankCustomCase(); S.cEditing = true; render(); },
    cEditDone() {
      if (!customValid(S.cCase)) { const e = document.getElementById('ccase-err'); if (e) e.textContent = 'اكتبوا التهمة والحاجة المهمة على الأقل.'; return; }
      S.cEditing = false; render();
    },
    cSaveLib() {
      if (!customValid(S.cCase)) { const e = document.getElementById('ccase-err'); if (e) e.textContent = 'اكتبوا التهمة والحاجة المهمة على الأقل.'; return; }
      libSave(S.cCase); S.cEditing = false; SND.play('stamp'); render();
    },
    cLibPick(id) {
      const c = libAll().find((x) => x.id === id);
      if (!c) return;
      S.cCase = Object.assign(blankCustomCase(), c, { custom: true }); S.cEditing = false; go('cCase');
    },
    libAskDelete(id) {
      modal = { title: 'تمسحوا القضية دي؟', body: 'هتتمسح من مكتبتكم ومش هترجع.', actions: [{ label: 'أيوه، امسحها', act: 'libDelete', arg: id, cls: 'danger' }, { label: 'لأ', act: 'closeModal' }] };
      render();
    },
    libDelete(id) { store.set(COURT_LIB, libAll().filter((x) => x.id !== id)); modal = null; render(); },
    cToSecrets() {
      const d = dealSecrets(S.cPlayers, S.cCase, S.cGuilty);
      S.cTruth = d.truth; S.cMat = d.M;
      S.cEditing = false; S.revealIdx = 0; S.revealed = false; go('cPass');
    },
    cHide() {
      S.revealIdx++; S.revealed = false;
      if (S.revealIdx < S.cPlayers.length) { go('cPass'); return; }
      // everyone has seen their secret: now the whole table hears who is who
      SND.play('reveal'); go('cCast');
    },
    cBegin() {
      S.cPhases = buildPhases(S.cPlayers); S.cPhase = 0;
      resetTimer(0); SND.play('gavel'); go('cTrial');
    },
    cWhoIs() {
      modal = { title: 'مين مين في المحكمة', html: `${whoIsWhoHTML(S.cPlayers)}<p style="color:var(--wall-muted)">${WHOIS_NOTE}</p>`, actions: [{ label: 'تمام', act: 'closeModal', cls: 'primary' }] };
      render();
    },
    cNext() {
      stopTimer();
      S.cPhase = Math.min(S.cPhase + 1, S.cPhases.length - 1);
      const t = S.cPhases[S.cPhase].time;

    cHelp() {

          { label: 'إنهاء الجلسة', act: 'cQuit', cls: 'danger' },

    cResume() {

  // =====================================================================
  // ---------- every player on their own phone (LAN room through the host phone) ----------
  // The host phone runs a tiny relay (Android: LocalServer.java; dev: tools/relay_server.py) that serves this
  // page and passes JSON messages. All game logic runs in the host's page; other phones only render views.
  const MP = { role: null, id: null, name: '', pin: '', ips: [], port: 0, H: null, V: null, vAt: 0, online: true, newsDraft: '', err: '', join: { addr: '', name: '', pin: '' },
    // the in-app join: while the room finder runs, `finding` holds its progress line; `findTry` drops a search the player left
    finding: '', findTry: 0,
    // the court's opening on this phone: `for` = the session whose secret was seen (step 'cast'), `key` = the one done
    intro: { key: '', for: '', step: '' },
    // online rooms: the room type picked on the «كل واحد على موبايله» page ('lan' | 'online'), the room's code, the host's
    // room settings (name, private + password), the create / join forms, the server-browser search, and what's loading
    net: (() => { try { return localStorage.getItem('qadaya.mp.net') === 'online' ? 'online' : 'lan'; } catch (e) { return 'lan'; } })(),
    code: '', room: { name: '', priv: false }, olc: { name: '', room: '', priv: false, pw: '' }, olj: { code: '', name: '', pw: '', room: null, needPw: false }, olq: '', olBusy: '', olTry: 0 };
  // the relay (LocalServer.java / tools/relay_server.py) gives each phone a secret key and stamps who sent every message.
  // `via` picks the room type for start / send / stop: 'lan' = that relay, 'online' = OL (a public broker, sealed end to end)
  const NET = {
    via: 'lan', base: '', timer: 0, last: 0, key: '', busy: false,
    async call(path, body) {
      const opt = body === undefined ? { cache: 'no-store' } : { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) };
      const r = await fetch(NET.base + path, opt);
      return r.json();
    },
    start(key, onMsg) {
      if (NET.via === 'online') { OL.listen(onMsg); return; }
      NET.key = key; NET.last = 0;
      clearInterval(NET.timer);
      NET.timer = setInterval(async () => {
        if (NET.busy) return;
        NET.busy = true;
        try {
          const r = await NET.call(`/api/recv?key=${encodeURIComponent(NET.key)}&after=${NET.last}`);
          (r.msgs || []).forEach((m) => { NET.last = Math.max(NET.last, m.seq); try { onMsg(m.data, m.from); } catch (e) { /* bad message */ } });
          if (!MP.online) { MP.online = true; render(); }
        } catch (e) { if (MP.online) { MP.online = false; render(); } }
        NET.busy = false;
      }, 700);
    },
    stop() { clearInterval(NET.timer); NET.timer = 0; VC.stop(); OL.stop(); },
    send(to, data) {
      if (NET.via === 'online') return OL.send(to, data);
      return NET.call('/api/send', { key: NET.key, to, data }).catch(() => null);
    },
  };
  // one id per phone for this game, kept across page reloads: lets a player who dropped out take their own seat back
  function deviceId() {
    const k = 'qadaya.mp.dev';
    try {
      let d = localStorage.getItem(k);
      if (!d) { d = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, '0')).join(''); localStorage.setItem(k, d); }
      return d;
    } catch (e) {
      MP.devMem = MP.devMem || String(Math.random()).slice(2) + String(Date.now());
      return MP.devMem;
    }
  }
  // a room page comes from the host phone (or the dev relay) over plain http; the installable web app is on https
  const servedByRoom = () => location.protocol === 'http:';
  // hosting a same-Wi-Fi room needs the Android app's own server (or the dev relay): iPhone / the web app can only join one
  const canHostLan = () => !!(NATIVE && NATIVE.startServer) || servedByRoom();
  async function relayReachable() {
    try { const r = await NET.call('/api/ping'); return !!(r && r.ok); } catch (e) { return false; }
  }

  // =====================================================================
  // ---------- online rooms: the same game over the internet, no shared Wi-Fi or hotspot ----------
  // The phones meet on a free public MQTT broker over secure WebSocket (no accounts, nothing to set up). The broker only
  // carries sealed boxes: every phone agrees its own AES key with the host phone (ECDH P-256 → HKDF-SHA-256 → AES-GCM-256,
  // salted with the room code, and for a private room with a PBKDF2 of the password too), so neither the broker nor another
  // player can read someone's secret sheet or act as them. The host page stays the only source of truth, exactly like the
  // LAN room: to hostOnMsg a phone looks like a relay id 'o<c>'.
  // Topics (ns = 'mjg1/' + rid, rid = 24 hex of SHA-256('mjg1 room ' + code)):
  //   ns/k            the host's public key {v, pub, tag, priv}, retained while the room is open (tag = HMAC of pub keyed by the code)
  //   ns/h            phone → host: {v, c, pub, box} to join, then {v, c, box}; {v, q: 1} asks the host to publish ns/k again
  //   ns/c/<c>        host → the phone with client tag c: {v, box}; before a join is accepted, a private room may answer {v, no: 'pw'}
  //   mjg1/lobby/<rid> the room's public listing for the server browser (retained, refreshed every 10 s, cleared on close,
  //                   and by the broker itself through the host connection's last will if the host phone just vanishes)
  // box = base64(iv ‖ AES-GCM(JSON {n, d, r?})); n goes up by one per message and direction, so old or replayed boxes are dropped.
  // QoS 0 can lose a message: the host numbers each phone's views (r) and sends a tiny {t:'beat'} with the current r every
  // few seconds; a phone that missed a view says {t:'hi'} and gets it whole. A phone also says hi after reconnecting.
  const OL_BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
  const OL_SLOTS = 8; // the code's first letter names the broker slot; fixed at 8 so a later version can add brokers without breaking codes
  const OL_ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O or 1/I/L: easy to read out on a call
  const OL_LAST_KEY = 'qadaya.ol.last.v1'; // the last online room this phone joined, to fill the code in again
  const OL_PV = 1; // the listing / key format
  const OL_VER = '0.13';
  const OL_STALE = 40000; // a listing not refreshed for this long is a room that's gone
  const TE = typeof TextEncoder === 'function' ? new TextEncoder() : null;
  const TD = typeof TextDecoder === 'function' ? new TextDecoder() : null;
  const randHex = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => b.toString(16).padStart(2, '0')).join('');
  const hexOf = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, '0')).join('');

  // ---- a minimal MQTT 3.1.1 client: QoS 0, clean session, optional last will ----
  function mqLen(n) { const out = []; do { let b = n % 128; n = Math.floor(n / 128); if (n) b |= 128; out.push(b); } while (n); return out; }
  function mqStr(s) { const b = TE.encode(s); const out = new Uint8Array(b.length + 2); out[0] = b.length >> 8; out[1] = b.length & 255; out.set(b, 2); return out; }
  function mqPacket(head, ...parts) {
    const size = parts.reduce((a, p) => a + p.length, 0);
    const len = mqLen(size);
    const out = new Uint8Array(1 + len.length + size);
    out[0] = head; out.set(len, 1);
    let o = 1 + len.length;
    parts.forEach((p) => { out.set(p, o); o += p.length; });
    return out;
  }
  // cuts the byte stream into packets: one WebSocket message may hold part of a packet, or several
  function mqReader(onPacket) {
    let buf = new Uint8Array(0);
    return (chunk) => {
      let all = chunk;
      if (buf.length) { all = new Uint8Array(buf.length + chunk.length); all.set(buf); all.set(chunk, buf.length); }
      let off = 0;
      while (all.length - off >= 2) {
        let len = 0, mul = 1, i = off + 1, b = 0, n = 0;
        do { if (i >= all.length) { len = -1; break; } b = all[i++]; len += (b & 127) * mul; mul *= 128; n++; } while ((b & 128) && n < 4);
        if (len < 0) break; // the length itself hasn't fully arrived yet
        if (b & 128) throw new Error('mqtt: bad length');
        if (all.length - i < len) break;
        onPacket(all[off], all.subarray(i, i + len));
        off = i + len;
      }
      buf = all.slice(off);
    };
  }
  // one broker connection; resolves once the broker has accepted it (CONNACK). `will` = {topic, msg}: published retained
  // by the broker if this connection dies without saying goodbye
  function mqConnect(url, ms, will) {
    return new Promise((resolve, reject) => {
      let ws;
      try { ws = new WebSocket(url, 'mqtt'); } catch (e) { reject(e); return; }
      ws.binaryType = 'arraybuffer';
      const C = { url, open: false, sink: null, lastIn: Date.now(), pingAt: 0, pid: 0, acks: new Map() };
      let settled = false;
      const fail = (why) => { if (settled) return; settled = true; clearTimeout(t); try { ws.close(); } catch (e) { /* ignore */ } reject(new Error(why)); };
      const t = setTimeout(() => fail('timeout'), ms || 12000);
      C.send = (u8) => { if (ws.readyState !== 1) return false; try { ws.send(u8); return true; } catch (e) { return false; } };
      C.pub = (topic, text, retain) => C.send(mqPacket(0x30 | (retain ? 1 : 0), mqStr(topic), TE.encode(text)));
      C.sub = (topics) => new Promise((res, rej) => {
        C.pid = (C.pid % 65535) + 1;
        const id = C.pid;
        const parts = [];
        topics.forEach((tp) => parts.push(mqStr(tp), [0]));
        const to = setTimeout(() => done(false), 10000);
        function done(ok) { clearTimeout(to); C.acks.delete(id); if (ok) res(); else rej(new Error('subscribe')); }
        C.acks.set(id, done);
        if (!C.send(mqPacket(0x82, [id >> 8, id & 255], ...parts))) done(false);
      });
      C.ping = () => C.send(new Uint8Array([0xC0, 0]));
      C.close = () => { C.open = false; C.send(new Uint8Array([0xE0, 0])); try { ws.close(); } catch (e) { /* ignore */ } };
      const read = mqReader((h, b) => {
        const type = h >> 4;
        if (type === 2) { // CONNACK
          if (b[1] === 0 && !settled) { settled = true; clearTimeout(t); C.open = true; resolve(C); } else fail('refused');
        } else if (type === 3) { // PUBLISH
          const qos = (h >> 1) & 3;
          let p = 2 + ((b[0] << 8) | b[1]);
          const topic = TD.decode(b.subarray(2, p));
          if (qos) { if (qos === 1) C.send(new Uint8Array([0x40, 2, b[p], b[p + 1]])); p += 2; }
          const text = TD.decode(b.subarray(p));
          if (C.sink) { try { C.sink.onPub(topic, text, !!(h & 1)); } catch (e) { /* a bad message */ } }
        } else if (type === 9) { // SUBACK
          const cb = C.acks.get((b[0] << 8) | b[1]);
          if (cb) cb(!b.subarray(2).includes(0x80));
        } // 13 = PINGRESP: lastIn below is all it's for
      });
      // v3.1.1, clean session, keepalive 60 s (the broker waits 90 s: enough for a phone whose timers slow down in the background)
      ws.onopen = () => {
        const flags = 2 | (will ? 0x04 | 0x20 : 0); // clean session (+ a retained QoS 0 will)
        C.send(mqPacket(0x10, mqStr('MQTT'), [4, flags, 0, 60], mqStr(`mjg-${randHex(8)}`), ...(will ? [mqStr(will.topic), mqStr(will.msg || '')] : [])));
      };
      ws.onmessage = (e) => {
        C.lastIn = Date.now();
        try { read(new Uint8Array(e.data)); } catch (err) { C.close(); }
      };
      ws.onerror = () => { /* onclose follows */ };
      ws.onclose = () => {
        const was = settled;
        C.open = false;
        C.acks.forEach((cb) => cb(false));
        if (!was) fail('closed'); else if (C.sink && C.sink.onDown) C.sink.onDown(C);
      };
    });
  }

  // ---- crypto (WebCrypto: needs a secure context, which the app's file:// page, https and localhost are) ----
  const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (s) => Uint8Array.from(atob(String(s)), (ch) => ch.charCodeAt(0));
  const sha256 = async (text) => new Uint8Array(await crypto.subtle.digest('SHA-256', TE.encode(text)));
  const ECDH = { name: 'ECDH', namedCurve: 'P-256' };
  const olRid = async (code) => hexOf((await sha256(`mjg1 room ${code}`)).subarray(0, 12));
  // everything the room code gives: the topic prefix, the salt of every phone's key, and the key that signs the host's public key
  async function olRoom(code) {
    const [rid, salt, tag] = await Promise.all([olRid(code), sha256(`mjg1 salt ${code}`), sha256(`mjg1 tag ${code}`)]);
    const tagKey = await crypto.subtle.importKey('raw', tag, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return { rid, ns: `mjg1/${rid}`, salt, tagKey };
  }
  // a private room: the password goes into every phone's key (never on the wire), so a wrong password simply can't talk to
  // the host. PBKDF2 makes guessing it from a recorded join slow
  const olPwNorm = (pw) => String(pw || '').trim().replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).slice(0, 20);
  async function olPwSalt(code, pw) {
    const base = await crypto.subtle.importKey('raw', TE.encode(olPwNorm(pw)), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: TE.encode(`mjg1 pw ${code}`), iterations: 60000 }, base, 256));
  }
  const olTag = async (tagKey, pub) => b64(new Uint8Array(await crypto.subtle.sign('HMAC', tagKey, pub)).subarray(0, 16));
  const olKeyPair = () => crypto.subtle.generateKey(ECDH, false, ['deriveBits']);
  const olPubRaw = async (kp) => new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey));
  async function olDerive(kp, pubRaw, salt, c) {
    if (!(pubRaw instanceof Uint8Array) || pubRaw.length !== 65 || pubRaw[0] !== 4) throw new Error('bad key');
    const peer = await crypto.subtle.importKey('raw', pubRaw, ECDH, true, []);
    const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: peer }, kp.privateKey, 256);
    const hk = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt, info: TE.encode(`mjg1 phone ${c}`) }, hk, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  // the direction ('c2h' phone → host, 'h2c' back) and the phone's tag are sealed in, so a box can't be bounced back or to someone else
  async function olSeal(key, dir, c, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: TE.encode(`mjg1|${dir}|${c}`) }, key, TE.encode(JSON.stringify(obj))));
    const out = new Uint8Array(12 + ct.length);
    out.set(iv); out.set(ct, 12);
    return b64(out);
  }
  async function olOpen(key, dir, c, box) {
    const u = unb64(box);
    if (u.length < 29) throw new Error('short');
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(0, 12), additionalData: TE.encode(`mjg1|${dir}|${c}`) }, key, u.subarray(12));
    return JSON.parse(TD.decode(pt));
  }

  // ---- room codes ----
  function olNewCode(slot) {
    const r = crypto.getRandomValues(new Uint8Array(6));
    const firsts = [...OL_ALPH].filter((ch, i) => i % OL_SLOTS === slot);
    return firsts[r[0] % firsts.length] + Array.from(r.subarray(1), (b) => OL_ALPH[b % OL_ALPH.length]).join('');
  }
  const olSlot = (code) => OL_ALPH.indexOf(code[0]) % OL_SLOTS;
  // a typed code: capitals, spaces and dashes dropped; null unless it's 6 characters of the code alphabet
  function olCodeOf(text) {
    const s = String(text || '').toUpperCase().replace(/[\s\-_.]/g, '');
    return s.length === 6 && [...s].every((ch) => OL_ALPH.includes(ch)) ? s : null;
  }
  // the code inside a pasted invite («كود الأوضة: K7M2QX»), else the first code-like word in it.
  // After the label, the next 6 characters are taken whatever follows: a one-line field drops the message's
  // line breaks, which glues the code to the next line («K7M2QX3) هنعمل…»)
  function olFindCode(text) {
    const s = String(text || '').toUpperCase();
    const tagged = s.match(/كود(?: الأوضة)?\s*[:：]?\s*([A-Z0-9]{3}[ -]?[A-Z0-9]{3})/);
    const words = [...s.matchAll(/(?:^|[^A-Z0-9])([A-Z0-9]{3}[ -]?[A-Z0-9]{3})(?![A-Z0-9])/g)].map((m) => m[1]);
    return [tagged && tagged[1], ...words].map(olCodeOf).find(Boolean) || null;
  }
  // what a state shows, minus the clocks that tick down between two copies of it (the host's regular resend)
  const olSig = (d) => JSON.stringify(d, (k, v) => (k === 'leftMs' ? undefined
    : k === 'timer' && v && typeof v === 'object' ? [v.running, v.total, v.running ? Math.round((Date.now() / 1000 + v.left) / 3) : v.left] : v));

  // ---------- the in-app join: find the room by its PIN alone, on this phone's own Wi-Fi / hotspot ----------
  // The joining phone asks the addresses of its own networks (/24) whether a room with this PIN is open there
  // (GET /api/find?pin=…, which only answers yes on a match). A hotspot or router is usually x.x.x.1, and DHCP
  // hands out neighbouring numbers, so those go first; the first room that answers wins.
  const ROOM_PORTS = [8765, 8766, 8767, 8768, 8769, 8770]; // LocalServer takes the first free one from 8765
  const ipv4 = (a) => { const p = String(a).replace(/:\d+$/, '').split('.').map(Number); return p.length === 4 && p.every((n) => Number.isInteger(n) && n >= 0 && n <= 255) ? p : null; };
  // every "ip:port" to ask, best first, from this phone's own addresses (private networks only: not mobile data)
  function roomFindTargets(ips, ports) {
    ports = ports && ports.length ? ports : ROOM_PORTS;
    const own = new Set();
    const nets = [];
    (ips || []).forEach((a, i) => {
      const p = ipv4(a);
      if (!p || roomAddrRank(p.join('.')) >= 6) return;
      own.add(p.join('.'));
      const net = p.slice(0, 3).join('.');
      if (!nets.some((x) => x.net === net)) nets.push({ net, me: p[3], r: roomAddrRank(p.join('.')), i });
    });
    nets.sort((x, y) => x.r - y.r || x.i - y.i);
    const out = [], seen = new Set();
    const add = (net, h, port) => {
      const ip = `${net}.${h}`, k = `${ip}:${port}`;
      if (h < 1 || h > 254 || own.has(ip) || seen.has(k)) return;
      seen.add(k); out.push(k);
    };
    const near = (me) => Array.from({ length: 254 }, (_, i) => i + 1).sort((a, b) => Math.abs(a - me) - Math.abs(b - me) || a - b);
    // 1) gateway-like hosts on every port, 2) every host on the first port (where a room nearly always is),
    // 3) the other ports on the best network only (a second network is most often mobile data)
    nets.forEach((n) => [1, 254, 2, 100].forEach((h) => ports.forEach((pt) => add(n.net, h, pt))));
    nets.forEach((n) => near(n.me).forEach((h) => add(n.net, h, ports[0])));
    nets.slice(0, 1).forEach((n) => ports.slice(1).forEach((pt) => near(n.me).forEach((h) => add(n.net, h, pt))));
    return out;
  }
  // one address: {addr, game} when a room with this PIN is open there, else null (never waits longer than `ms`)
  function roomProbe(addr, pin, ms) {
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    let t = 0;
    const late = new Promise((r) => { t = setTimeout(() => { if (ctl) ctl.abort(); r(null); }, ms || 1200); });
    const ask = fetch(`http://${addr}/api/find?pin=${encodeURIComponent(pin)}`, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then((r) => r.json())
      .then((j) => (j && j.ok === true && j.app === 'qadaya' ? { addr, game: roomGame(j.game) } : null))
      .catch(() => null);
    return Promise.race([ask, late]).finally(() => clearTimeout(t));
  }
  // asks `targets` in order, `width` at a time; resolves the first hit or null. `alive()` false stops it early
  async function roomFind(targets, pin, opt) {
    const o = opt || {};
    const probe = o.probe || roomProbe, alive = o.alive || (() => true);
    let next = 0, done = 0, hit = null, found = null;
    const first = new Promise((r) => { found = r; });
    const worker = async () => {
      while (!hit && alive() && next < targets.length) {
        const r = await probe(targets[next++], pin, o.ms || 1000);
        done++;
        if (r && !hit) { hit = r; found(r); }
        if (o.progress && !hit) o.progress(done, targets.length);
      }
    };
    // the first hit answers at once (the probes still out finish on their own)
    await Promise.race([first, Promise.all(Array.from({ length: Math.min(o.width || 64, targets.length) }, worker))]);

  // this phone's own IPv4 addresses (the app only; a browser can't tell)

  }
  // the in-app «ادخل»: find the room with this PIN, then open its page inside the app (it joins with the name)
  async function roomFindAndOpen(name, pin) {
    const J = MP.join;
    const targets = [];
    // a join link pasted on this screen (a hidden shortcut): its address is asked first
    const L = J.addr ? parseRoomLink(J.addr) : null;
    if (L && ipv4(L.addr)) targets.push(/:\d+$/.test(L.addr) ? L.addr : `${L.addr}:${ROOM_PORTS[0]}`);
    roomFindTargets(ownIps()).forEach((a) => { if (!targets.includes(a)) targets.push(a); });
    if (!targets.length) {
      MP.err = NATIVE && NATIVE.getIps
        ? 'موبايلك مش متوصل بأي واي فاي. ادخل على نفس الواي فاي بتاع المضيف، أو على الهوت سبوت بتاعه، وجرب تاني.'
        : 'الدخول بالرقم السري بس شغال من تطبيق اللعبة. من المتصفح، دوس على لينك الدخول اللي المضيف بعتهولك.';

    const alive = () => tryId === MP.findTry && S.screen === 'mpJoin' && !MP.role;

    setTimeout(() => { if (tryId === MP.findTry && MP.finding) { MP.finding = ''; if (S.screen === 'mpJoin') render(); } }, 8000);
  }

  // ---------- host logic (authoritative) ----------
  function hostPlayer(id) { return MP.H.players.find((p) => p.id === id); }
  function hostTimerLeft() { const t = MP.H.timer; return t.running ? Math.max(0, Math.ceil((t.endAt - Date.now()) / 1000)) : t.left; }
  // online rooms add who has voice on (pub.vc) to every view
  function hostView(p) {

  }
  function hostView0(p) {
    const H = MP.H;

    const judge = H.players.find((x) => x.role === 'judge');
    const pub = {
      stage: H.stage, no: H.no, players: H.players.map((q) => ({ id: seatOf(q), name: q.name, role: inGame ? q.role : null })),
      judgeId: judge ? seatOf(judge) : null, hostName: H.players[0].name,
      case: inGame && H.case ? { title: H.case.title || '', charge: H.case.charge, place: H.case.place, time: H.case.time, thing: H.case.thing, victimLabel: H.case.victimLabel } : null,
      phases: H.phases, phase: H.phase, timer: { left: hostTimerLeft(), running: H.timer.running, total: H.timer.total },
      evidence: H.evidence, pending: H.pending, objection: H.objection, ruling: H.ruling,
      end: H.stage === 'end' ? { verdict: H.verdict, sentence: H.sentence, guilty: H.guilty, truth: H.truth, done: H.done, W: courtScore(H.players, H.verdict, H.guilty, H.evidence, H.done), players: H.players.map((q) => ({ name: q.name, role: q.role, side: q.side, mission: q.mission })) } : null,
    };
    const me = { id: seatOf(p), name: p.name };
    if (inGame) {
      Object.assign(me, { role: p.role, side: p.side || null, mission: p.mission, fact: p.fact || null });
      if (p.role === 'defendant') { me.truth = H.truth; me.guilty = H.guilty; }
      if (p.role === 'judge') { me.draftVerdict = H.verdict; me.sentence = H.sentence; }
      if (p.role === 'journalist') me.newsLeft = NEWS_PER_JOURNALIST - H.evidence.filter((e) => e.side === 'news').length;

  }
  function hostBroadcast() {
    const H = MP.H;
    H.players.forEach((p) => {
      const v = hostView(p);
      if (p.id === 'host') applyView(v); else NET.send(p.id, v);
    });
    if (NET.via === 'online') OL.lobbyDirty();
  }
  // online rooms: the broker may drop a message, so every few seconds (and after a reconnect) each phone's view goes out
  // again; the online layer turns a view the phone already has into a small heartbeat
  function hostResend() {
    const H = MP.H;
    if (MP.role !== 'host' || !H || NET.via !== 'online') return;
    H.players.forEach((p) => { if (p.id !== 'host' && !p.away) NET.send(p.id, hostView(p)); });
  }
  // `from` is stamped by the relay from the sender's secret key ('' = the relay itself), never taken from the message
  function hostOnMsg(d, from) {
    const H = MP.H;
    if (!d || !H) return;
    if (d.t === 'join') {
      if (from !== '') return;
      const name = String(d.name || '').trim().slice(0, 18);
      const dev = String(d.dev || '');
      const cap = H.game === 'cases' ? 8 : 10;
      const same = H.players.find((p) => p.name.toLowerCase() === name.toLowerCase());
      // the same phone coming back (page reload, Wi-Fi drop) gets its own seat back; another phone can't take a seat by name
      if (same && same.id !== 'host' && dev && same.dev === dev) { mpRejoin(same, d.id); hostBroadcast(); return; }
      if (same) {
        NET.send(d.id, { t: 'kick', msg: H.stage === 'lobby' ? 'الاسم ده موجود، اختار اسم تاني.' : 'الاسم ده بيلعب بيه حد تاني. لو ده إنت وموبايلك فصل، ادخل من نفس الموبايل.' });
        return;
      }
      if (H.stage !== 'lobby') { NET.send(d.id, { t: 'kick', msg: 'اللعب بدأ خلاص. استنوا الجولة الجاية.' }); return; }
      if (!name || H.players.length >= cap) {
        NET.send(d.id, { t: 'kick', msg: !name ? 'اكتب اسمك.' : `الأوضة مليانة (${cap} لاعبين).` });
        return;
      }
      H.seatN = (H.seatN || 0) + 1;
      H.players.push({ id: d.id, seat: `s${H.seatN}`, dev, name });
      SND.play('handoff');
      hostBroadcast();
      return;
    }
    if (!from || from === 'host') return;

    if (d.t === 'hi') { const p = hostPlayer(from); if (p) NET.send(from, hostView(p)); return; }
    // online voice: a phone turned its voice on / passes a call signal to another seat (the host stamps who it's from)

    if (d.t === 'rtc') { const p = hostPlayer(from); if (p && NET.via === 'online') vcRelay(seatOf(p), d.to, d.d); return; }

  }
  // public ids are seats ('h', 's1', 's2'…) that never change; the relay id only addresses the phone
  const seatOf = (p) => p.seat || (p.id === 'host' ? 'h' : p.id);
  // the host passes a voice signal on: to its own page, or sealed to the target seat's phone
  function vcRelay(fromSeat, to, dd) {
    if (!dd || typeof dd !== 'object' || typeof to !== 'string') return;
    let size = 0;
    try { size = JSON.stringify(dd).length; } catch (e) { return; }
    if (size > 24000) return;
    if (to === 'h') { vcOnSignal(fromSeat, dd); return; }
    const q = MP.H.players.find((x) => seatOf(x) === to && x.id !== 'host' && !x.away);
    if (q) NET.send(q.id, { t: 'rtc', from: fromSeat, d: dd });
  }
  function mpRejoin(p, newId) {
    const old = p.id;
    p.id = newId;
    p.away = false;
    p.vc = false; // the new page turns its voice on by itself
    if (old && old !== newId) NET.send(old, { t: 'kick', msg: 'دخلت من صفحة تانية، فالصفحة دي اتقفلت.' });
    SND.play('handoff');
  }
  function mpPlayerLeft(from) {
    const H = MP.H;
    const p = hostPlayer(from);
    if (!p) return;
    const between = H.stage === 'lobby' || H.stage === 'setup' || H.stage === 'end';
    if (between) {
      H.players = H.players.filter((q) => q !== p);
      if (H.game === 'cases' && H.stage === 'setup') {
        if (H.caseId && !mcFits(caseById(H.caseId), H.players.length)) H.caseId = null;
        if (H.players.length < 3) H.stage = 'lobby';
      }
      if (H.game === 'cases' && H.stage === 'end') mcToSetup();
    } else {
      p.away = true; // mid-game: the seat stays (roles, votes and history point at it) but no longer holds the table up

    }

  }
  function hostStartGame() {
    const H = MP.H;
    const names = H.players.map((p) => p.name);
    const judgeIdx = H.judgeMode === 'pick' && H.judgePick != null && H.judgePick < names.length ? H.judgePick : rand(names.length);
    const roles = assignCourtRoles(names, judgeIdx);
    H.players.forEach((p, i) => { Object.assign(p, roles[i]); });
    H.guilty = rand(2) === 0;
    const d = dealSecrets(H.players, H.case, H.guilty);
    H.truth = d.truth; H.mat = d.M; H.ctx = d.ctx;
    H.phases = buildPhases(H.players); H.phase = 0;
    H.evidence = []; H.pending = []; H.objection = null; H.ruling = null; H.verdict = null; H.sentence = pickOne(COURT.sentences); H.done = {};
    H.timer = { total: 0, left: 0, running: false, endAt: 0 };

  }
  function hostSetTimer(sec) { MP.H.timer = { total: sec, left: sec, running: false, endAt: 0 }; }
  function courtNewHost(name) {
    return { stage: 'lobby', no: 100 + rand(900), players: [{ id: 'host', seat: 'h', name }], judgeMode: 'random', judgePick: null, kidsOnly: false, case: null, phases: [], phase: 0, evidence: [], pending: [], objection: null, ruling: null, timer: { total: 0, left: 0, running: false, endAt: 0 }, done: {} };
  }
  function hostAct(from, a, arg) {
    const H = MP.H;
    if (H.game === 'cases') { mcAct(from, a, arg); return; }
    const p = hostPlayer(from);
    if (!p) return;
    const isJudge = p.role === 'judge';
    const isHost = from === 'host';
    const party = !!SIDE_OF[p.role];
    let changed = true;
    switch (a) {
      case 'evReq': if (H.stage === 'trial' && party && !H.pending.some((x) => x.id === seatOf(p))) H.pending.push({ id: seatOf(p), name: p.name, side: SIDE_OF[p.role] }); else changed = false; break;
      case 'objection': if (H.stage === 'trial' && !isJudge && !H.objection) H.objection = { name: p.name, reason: hintPick(['objection'], 1, H.ctx)[0] || '' }; else changed = false; break;
      case 'news': {
        const left = NEWS_PER_JOURNALIST - H.evidence.filter((e) => e.side === 'news').length;
        const text = String(arg || '').trim().slice(0, 160);
        if (H.stage === 'trial' && p.role === 'journalist' && left > 0 && text) { H.evidence.push({ side: 'news', text }); SND.play('news'); } else changed = false;
        break;
      }
      case 'evGive': {
        if (!isJudge || H.stage !== 'trial') { changed = false; break; }
        const side = arg === 'pros' ? 'pros' : 'def';
        if (EVIDENCE_PER_SIDE - H.evidence.filter((e) => e.side === side).length <= 0) { changed = false; break; }
        H.evidence.push({ side, text: drawEvidence(H.mat, new Set(H.evidence.map((e) => e.text))) });
        H.pending = H.pending.filter((x) => x.side !== side);
        SND.play('hint');
        break;
      }
      case 'evDismiss': if (isJudge) H.pending = H.pending.filter((x) => x.id !== arg); else changed = false; break;
      case 'rule': if (isJudge && H.objection) { H.ruling = { ok: arg === 'ok', name: H.objection.name, at: Date.now() }; H.objection = null; SND.play(arg === 'ok' ? 'reveal' : 'gavel'); } else changed = false; break;
      case 'twist': {
        if (!isJudge || H.stage !== 'trial' || TWISTS_PER_TRIAL - H.evidence.filter((e) => e.side === 'twist').length <= 0) { changed = false; break; }
        const used = new Set(H.evidence.map((e) => e.text));
        const fresh = H.mat.twists.filter((t) => !used.has(t));
        H.evidence.push({ side: 'twist', text: pickOne(fresh.length ? fresh : H.mat.twists) });
        SND.play('suspense');
        break;
      }
      case 'next':
        if (!isJudge || H.stage !== 'trial') { changed = false; break; }
        if (H.phase < H.phases.length - 1) { H.phase++; const t = H.phases[H.phase].time; hostSetTimer(t > 0 && SET.time > 0 ? t : 0); SND.play('page'); }
        else { H.stage = 'verdict'; hostSetTimer(0); SND.play('suspense'); }
        break;
      case 'timer': {
        if (!isJudge) { changed = false; break; }
        const t = H.timer;
        if (arg === 'toggle') { if (t.running) { t.left = hostTimerLeft(); t.running = false; } else if (t.left > 0) { t.running = true; t.endAt = Date.now() + t.left * 1000; } }
        else if (arg === 'add') { if (t.running) t.endAt += 30000; else t.left += 30; t.total = Math.max(t.total, hostTimerLeft()); }
        break;
      }
      case 'verdict': if (isJudge && H.stage === 'verdict') H.verdict = arg === 'guilty' ? 'guilty' : 'innocent'; else changed = false; break;
      case 'sentence': if (isJudge) H.sentence = pickOne(COURT.sentences); else changed = false; break;
      case 'announce': if (isJudge && H.stage === 'verdict' && H.verdict) { H.stage = 'end'; SND.play(H.verdict === 'guilty' ? 'culprit' : 'win'); } else changed = false; break;
      case 'mission': if (isJudge && H.stage === 'end') { const i = Number(arg); H.done = Object.assign({}, H.done); H.done[i] = !H.done[i]; } else changed = false; break;
      case 'newRound':
        if (!isHost || H.stage !== 'end') { changed = false; break; }
        saveCourtStats(H.players, courtScore(H.players, H.verdict, H.guilty, H.evidence, H.done));
        H.players.forEach((q) => { delete q.role; delete q.side; delete q.fact; delete q.mission; });
        H.stage = 'setup'; H.case = randomCourtCase(H.kidsOnly); H.no = 100 + rand(900);
        break;
      default: changed = false;
    }
    if (changed) hostBroadcast();

  // ---------- views on every phone ----------
  function applyView(v) {

    const prevEv = MP.V && MP.V.pub.evidence ? MP.V.pub.evidence.length : 0;

      if (v.pub.ruling && v.pub.ruling.at !== prevRuling) SND.play(v.pub.ruling.ok ? 'reveal' : 'gavel');

  screens.olBrowse = () => `

      <div class="field"><input id="ol-q" data-olq="1" type="search" maxlength="30" enterkeyhint="search" autocomplete="off" value="${esc(MP.olq)}" placeholder="دوّر باسم الأوضة أو المضيف"></div>

  screens.olJoin = () => {

      ${R ? `<div><h1 class="h2">ادخل الأوضة</h1></div>
      <article class="paper olpick">
        <div class="report-head"><span>${esc(ROOM_GAMES[R.game])}${R.priv ? ' · برايفت 🔒' : ''}</span><b>${R.n}/${R.max}</b></div>

      ${MP.err ? `<p class="err" role="alert">${esc(MP.err)}</p>` : ''}

  function lobbyListHTML(pub) {
    const canKick = MP.role === 'host' && pub.stage === 'lobby';
    return `<ol class="cast">${pub.players.map((p, i) => `<li><div class="pn">${esc(p.name)}</div><div class="cn">${i === 0 ? 'المضيف' : 'لاعب'}${canKick && i > 0 ? ` <button class="linkbtn" data-act="mpKick" data-arg="${esc(p.id)}">شيله</button>` : ''}</div></li>`).join('')}</ol>`;

  screens.mpLobby = () => {

  screens.mpCase = () => {
    const H = MP.H;
    const c = H.case;
    return `
    <div class="screen">
      <div class="topbar"><button class="iconbtn" data-act="mpBackLobby">رجوع</button><span class="t">القضية</span></div>${vcBarHTML()}

        <p class="err" id="mpcase-err" role="alert"></p>`
      : `${caseCardHTML(c, { defendant: 'هيتعرف لما الأدوار تتوزع', victim: 'هيتعرف لما الأدوار تتوزع' })}

        ${libAll().length ? `<details class="prev"><summary>مكتبة قضاياكم (${libAll().length})</summary>${libHTML('mpLibPick')}</details>` : ''}`}

  screens.mpWait = () => {
    const pub = MP.V && MP.V.pub;
    return `
    <div class="screen">
      <div class="topbar"><button class="iconbtn" data-act="mpLeave">اخرج</button><span class="t">مستنيين المضيف</span></div>${vcBarHTML()}

        <p class="to">إنت في الأوضة يا</p>
        <div class="who">${esc(MP.name)}</div>
        <p class="note">${pub && pub.stage === 'setup' ? 'المضيف بيختار القضية دلوقتي…' : `مستنيين ${esc(pub ? pub.hostName : 'المضيف')} يبدأ ${MP.game === 'cases' ? 'اللعب' : 'الجلسة'}.`}</p>
      </div>
      ${pub ? `<article class="paper">${lobbyListHTML(pub)}</article>` : ''}
      ${MP.online ? '' : '<p class="err">الاتصال بالأوضة وقع… بنحاول تاني.</p>'}
    </div>`;
  };

  screens.mpPlay = () => {
    const v = MP.V;
    if (!v) return screens.mpWait();
    const { pub, me } = v;
    if (pub.stage === 'lobby' || pub.stage === 'setup') return screens.mpWait();
    const byRole = (r) => pub.players.find((p) => p.role === r) || { name: '' };
    const ph = pub.phases[pub.phase] || { t: '', who: '', note: '', time: 0 };
    const isJudge = me.role === 'judge';
    const ev = pub.evidence || [];
    const left = (side) => EVIDENCE_PER_SIDE - ev.filter((e) => e.side === side).length;
    const twistLeft = TWISTS_PER_TRIAL - ev.filter((e) => e.side === 'twist').length;
    const R = ROLE[me.role] || ROLE.witness;
    const myCard = `
      <details class="prev" ${MP.cardOpen === false ? '' : 'open'} data-mpcard="1"><summary>دورك: ${R.t}${me.role === 'witness' ? (me.side === 'pros' ? ' (إثبات)' : ' (نفي)') : ''}</summary>
        ${secretCardHTML({ name: me.name, role: me.role, side: me.side, fact: me.fact, mission: me.mission }, me.truth, me.guilty)}
      </details>`;
    const header = `
      <div class="topbar"><span class="t">قضية رقم ${pub.no} · القاضي ${esc(byRole('judge').name)}</span><button class="iconbtn" data-act="mpMenu">القائمة</button></div>${vcBarHTML()}
      ${pub.case ? caseCardHTML(pub.case, { defendant: byRole('defendant').name, victim: byRole('victim').name }) : ''}`;
    // a new session starts on every phone with: 1) your own secret, 2) «مين مين في المحكمة» (public roles only)
    const introKey = mpIntroKey(v);
    if (pub.stage === 'trial' && MP.intro.key !== introKey) {
      const top = `<div class="topbar"><span class="t">قضية رقم ${pub.no}</span><button class="iconbtn" data-act="mpMenu">القائمة</button></div>${vcBarHTML()}
        ${MP.online ? '' : '<p class="err">الاتصال بالأوضة وقع… بنحاول تاني.</p>'}`;
      if (MP.intro.step !== 'cast' || MP.intro.for !== introKey) {
        return `
      <div class="screen">
        ${top}
        <p class="eyebrow">ده سرك إنت بس. خبّي الموبايل عن اللي جنبك</p>
        ${secretCardHTML({ name: me.name, role: me.role, side: me.side, fact: me.fact, mission: me.mission }, me.truth, me.guilty)}
        <div class="actionbar"><button class="btn primary" data-act="mpIntroCast">حفظت سري، وريني مين مين</button></div>
      </div>`;
      }
      return `
      <div class="screen">
        ${top}
        <div><h1 class="h2">مين مين في المحكمة؟</h1><p class="lede">دي الأدوار اللي الكل عارفها. اعرف هتكلم مين، وخلي سرك لنفسك.</p></div>
        ${whoIsWhoHTML(pub.players)}
        <div class="ghostnote">${WHOIS_NOTE}</div>
        ${pub.case ? caseCardHTML(pub.case, { defendant: byRole('defendant').name, victim: byRole('victim').name }) : ''}
        <div class="actionbar"><button class="btn primary" data-act="mpIntroDone">تمام، يلا على الجلسة</button></div>
      </div>`;
    }
    if (pub.stage === 'end') {
      const E = pub.end;
      return `
      <div class="screen">
        ${header}
        ${endHTML({ verdict: E.verdict, sentence: E.sentence, guilty: E.guilty, truth: E.truth, defendant: byRole('defendant').name, judge: byRole('judge').name, judgeRight: (E.verdict === 'guilty') === E.guilty, players: E.players, done: E.done, W: E.W, canMark: isJudge, markAct: 'mpMission' })}
        <div class="actionbar">
          ${MP.role === 'host' ? '<button class="btn primary" data-act="mpNewRound">سجّل النقط وجلسة جديدة</button><button class="btn ghost" data-act="mpClose">اقفل الأوضة</button>' : '<p class="lede small" style="text-align:center">المضيف هيبدأ الجلسة الجاية.</p><button class="btn ghost" data-act="mpLeave">اخرج من الأوضة</button>'}
        </div>
      </div>`;
    }
    const judgePanel = !isJudge ? '' : pub.stage === 'verdict' ? `
      <h2 style="font:700 18px var(--f-ui)">إنت القاضي: احكم</h2>
      ${verdictPanelHTML(me.draftVerdict, me.sentence, 'mpJ')}
      <button class="btn primary" data-act="mpAnnounce" ${me.draftVerdict ? '' : 'disabled'}>انطق بالحكم</button>` : `
      <h2 style="font:700 18px var(--f-ui)">زراير القاضي</h2>
      ${pub.objection ? `<div class="ghostnote"><b>اعتراض من ${esc(pub.objection.name)}!</b> ${esc(pub.objection.reason || '')}<div class="court-tools" style="margin-top:8px"><button class="btn primary sm" data-act="mpRule" data-arg="ok">مقبول</button><button class="btn danger sm" data-act="mpRule" data-arg="no">مرفوض</button></div></div>` : ''}
      ${pub.pending.length ? `<div class="ghostnote">${pub.pending.map((r) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0"><span><b>${esc(r.name)}</b> طالب دليل (${sideName(r.side)})</span><span><button class="btn primary sm" data-act="mpGive" data-arg="${r.side}" ${left(r.side) > 0 ? '' : 'disabled'}>اطلّعله</button> <button class="btn ghost sm" data-act="mpDismiss" data-arg="${esc(r.id)}">لأ</button></span></div>`).join('')}</div>` : ''}
      <div class="court-tools">
        <button class="btn ghost sm side-pros" data-act="mpGive" data-arg="pros" ${left('pros') > 0 ? '' : 'disabled'}>دليل للادعاء (${left('pros')})</button>
        <button class="btn ghost sm side-def" data-act="mpGive" data-arg="def" ${left('def') > 0 ? '' : 'disabled'}>دليل للدفاع (${left('def')})</button>
      </div>
      <button class="btn ghost sm" data-act="mpTwist" ${twistLeft > 0 ? '' : 'disabled'}>مفاجأة في القضية (${twistLeft})</button>
      <button class="btn primary" data-act="mpNext">${pub.phase < pub.phases.length - 1 ? `التالي: ${esc(pub.phases[pub.phase + 1].t)}` : 'رُفعت الجلسة للمداولة'}</button>`;
    const party = !!SIDE_OF[me.role];
    const pendingMine = pub.pending.some((r) => r.id === me.id);
    const playerPanel = isJudge || pub.stage !== 'trial' ? (pub.stage === 'verdict' && !isJudge ? '<div class="ghostnote">القاضي بيفكر في الحكم… استنوا.</div>' : '') : `
      <div class="court-tools">
        ${party ? `<button class="btn ghost sm" data-act="mpEvReq" ${pendingMine ? 'disabled' : ''}>${pendingMine ? 'طلبك وصل للقاضي' : 'عندي دليل!'}</button>` : ''}
        <button class="btn danger sm" data-act="mpObjection" ${pub.objection ? 'disabled' : ''}>اعتراض!</button>
      </div>
      ${me.role === 'journalist' ? `<button class="btn ghost sm" data-act="mpNews" ${me.newsLeft > 0 ? '' : 'disabled'}>انشر خبر عاجل (${me.newsLeft})</button>` : ''}`;
    const timer = pub.stage === 'trial' && ph.time > 0 && SET.time > 0 ? `
      <section class="timerbox"><div class="timer" id="mp-timer" role="timer">${mmss(mpLeft())}</div>
        ${isJudge ? `<div class="tctl"><button data-act="mpTimer" data-arg="toggle">${pub.timer.running ? 'وقّف' : 'ابدأ'}</button><button data-act="mpTimer" data-arg="add">+30 ث</button></div>` : ''}
      </section>` : '';
    return `
    <div class="screen">
      ${header}
      ${MP.online ? '' : '<p class="err">الاتصال بالأوضة وقع… بنحاول تاني.</p>'}
      ${pub.stage === 'trial' ? `<article class="paper slip"><div class="report-head"><span>${esc(ph.t)} · ${pub.phase + 1} من ${pub.phases.length}</span><b>الكلمة لـ ${esc(ph.who)}</b></div><p class="hint">${esc(ph.note)}</p></article>` : ''}
      ${pub.ruling && Date.now() - MP.vAt < 8000 ? `<div class="ghostnote">اعتراض ${esc(pub.ruling.name)}: <b>${pub.ruling.ok ? 'مقبول' : 'مرفوض'}</b></div>` : ''}
      ${timer}
      ${myCard}
      <div class="court-tools">
        <button class="btn ghost sm" data-act="mpHelp">ساعدني أتكلم</button>
        <button class="btn ghost sm" data-act="mpWhoIs">مين مين؟</button>
      </div>
      ${judgePanel}
      ${playerPanel}
      ${evidenceLogHTML(ev)}
    </div>`;
  };

  const MP_ACTS = {
    openMp() { MP.err = ''; MP.game = 'court'; S = { screen: 'mpHome', mode: 'mp' }; render(); },
    mpCreateScreen() { MP.err = ''; go('mpCreate'); },
    mpJoinScreen() { MP.err = ''; MP.finding = ''; MP.findTry++; go('mpJoin'); },
    // the in-app join: stop looking for the room
    mpFindStop() { MP.findTry++; MP.finding = ''; render(); },
    // «على نفس الواي فاي» / «أونلاين»
    mpNet(v) {
      MP.net = v === 'online' ? 'online' : 'lan';
      try { localStorage.setItem('qadaya.mp.net', MP.net); } catch (e) { /* storage unavailable */ }
      MP.err = ''; render();
    },
    olCreateScreen() { MP.err = ''; MP.olBusy = ''; MP.olTry++; S = { screen: 'olCreate', mode: MP.game === 'cases' ? 'mc' : 'mp' }; render(); },
    olBrowseScreen() { MP.err = ''; MP.olBusy = ''; MP.olTry++; S = { screen: 'olBrowse', mode: MP.game === 'cases' ? 'mc' : 'mp' }; olbStart(); render(); },
    olJoinScreen() {
      MP.err = ''; MP.olBusy = ''; MP.olTry++;
      MP.olj.room = null; MP.olj.needPw = false; MP.olj.pw = '';
      // the code of the last online room this phone was in comes back (a dropped phone rejoins in one tap)
      const last = store.get(OL_LAST_KEY);
      if (!MP.olj.code && last && last.code && Date.now() - last.at < 6 * 3600 * 1000) MP.olj.code = last.code;
      S = { screen: 'olJoin', mode: MP.game === 'cases' ? 'mc' : 'mp' }; render();
    },
    olPriv(v) {
      const g = (id) => { const el = document.getElementById(id); return el ? el.value : null; };
      ['name', 'room', 'pw'].forEach((k) => { const x = g({ name: 'ol-hname', room: 'ol-rname', pw: 'ol-pw' }[k]); if (x != null) MP.olc[k] = x; });
      MP.olc.priv = v === '1'; MP.err = ''; render();
      if (MP.olc.priv) { const p = document.getElementById('ol-pw'); if (p) p.focus(); }
    },
    // a room tapped in the server browser: its join form (name, and the password if it's private)
    olPickRoom(rid) {
      const r = OLB.rooms.get(rid);
      if (!r) { olbPaint(); return; }
      MP.olj = Object.assign({}, MP.olj, { code: r.code, room: Object.assign({}, r), pw: '', needPw: false });
      MP.err = ''; MP.olBusy = ''; MP.olTry++;
      MP.game = r.game;
      S = { screen: 'olJoin', mode: r.game === 'cases' ? 'mc' : 'mp' }; render();
    },
    // online host lobby: send the ready message with the code / copy the code alone
    async olShare(game) {
      if (!MP.code) return;
      await shareOrCopy(olInviteText(game), 'نسختلك رسالة الدخول والكود. الصقها في واتساب أو أي شات وابعتها.', 'مقدرتش أنسخ. قول الكود لصحابك أو اكتبهولهم.');
    },
    async olCopy() {
      if (!MP.code) return;
      const ok = await copyText(MP.code);
      toast(ok ? 'نسختلك الكود. الصقه في واتساب أو أي شات.' : 'مقدرتش أنسخ. قول الكود لصحابك أو اكتبهولهم.');
    },
    async olHost() {
      const game = MP.game === 'cases' ? 'cases' : 'court';
      if (MP.olBusy) return;
      const val = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
      const F = MP.olc;
      Object.assign(F, { name: val('ol-hname'), room: val('ol-rname'), pw: F.priv ? val('ol-pw') : F.pw });
      const name = F.name.trim().slice(0, 18);
      const room = (F.room.replace(/\s+/g, ' ').trim() || olDefaultRoom(name)).slice(0, 24);
      const pw = olPwNorm(F.pw);
      const focus = (id) => { const f = document.getElementById(id); if (f) f.focus(); };
