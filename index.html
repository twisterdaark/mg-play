<script>
// installable web app (iPhone «Add to Home Screen», Android Chrome): the service worker keeps the game working offline.
// Only on https or this computer: not file:// (the Android app) and not a room page served by the host phone over LAN http.
(function () {
  try {
    var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || (location.protocol === 'http:' && local)))
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    // an update that lands in the first seconds after opening (while the intro plays) reloads once onto the new build;
    // later ones wait for the next open, so a game in progress is never cut
    var hadOld = !!(navigator.serviceWorker && navigator.serviceWorker.controller), t0 = Date.now(), done = false;
    if (hadOld) navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!done && Date.now() - t0 < 8000) { done = true; location.reload(); }
    });
  } catch (e) { /* no service worker */ }
})();
</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>مين الجاني؟</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    color-scheme: dark;
    /* جدار القسم الأخضر + ورق المحاضر + حبر الختم البنفسجي */
    --wall: #1B3430;
    --wall-deep: #0F201D;
    --wall-line: #2E4D47;
    --wall-raise: #22403B;
    --wall-text: #ECE5D2;
    --wall-muted: #A7B6AC;
    --lamp: #EFC26A;
    --lamp-deep: #B98A34;
    --paper: #F1E6CC;
    --paper-2: #E2D0A8;
    --paper-line: #CDB88C;
    --ink: #231E17;
    --ink-soft: #5F533F;
    --carbon: #2A3E97;
    --stamp: #5F3D8C;
    --blood: #8F2C22;
    --foil-a: #C8CBD1;
    --foil-b: #979CA5;
    --rcard-a: #F8F0DB;
    --rcard-b: #E7D7AF;
    --scratch-bg: #FFF9EA;
    --f-display: "Aref Ruqaa", "Noto Naskh Arabic", "Traditional Arabic", serif;
    --f-body: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
    --f-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; touch-action: manipulation; }
  body {
    background: var(--wall-deep);
    color: var(--wall-text);
    font-family: var(--f-ui);
    font-size: 16px;
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(130% 55% at 50% -12%, rgba(239, 194, 106, .16), transparent 62%),
      linear-gradient(180deg, var(--wall) 0%, var(--wall-deep) 100%);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }

  .screen {
    flex: 1;
    width: 100%;
    max-width: 520px;
    margin-inline: auto;
    padding-inline: 16px;
    padding-block: 18px 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .actionbar {
    position: sticky;
    bottom: 0;
    margin-top: auto;
    margin-inline: -16px;
    padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, rgba(15, 32, 29, 0), var(--wall-deep) 38%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 2;
  }

  /* ---------- type ---------- */
  h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
  .h-display { font-family: var(--f-display); font-weight: 700; line-height: 1.25; }
  .h2 { font-family: var(--f-display); font-size: 30px; line-height: 1.3; }
  .eyebrow { font: 600 13px/1.4 var(--f-ui); letter-spacing: .03em; color: var(--wall-muted); margin: 0; }
  .lede { margin: 0; color: var(--wall-muted); }
  .small { font-size: 14px; }
  p { margin: 0; }

  /* ---------- buttons ---------- */
  .btn {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 15px 18px;
    font: 600 17px/1.25 var(--f-ui);
    text-align: center;
  }
  .btn.primary { background: var(--lamp); color: var(--ink); box-shadow: 0 3px 0 var(--lamp-deep); }
  .btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--lamp-deep); }
  .btn.ghost { background: transparent; color: var(--wall-text); border: 1.5px solid var(--wall-line); }
  .btn.danger { background: var(--blood); color: #FBEFEA; }
  .btn:disabled { opacity: .4; cursor: default; box-shadow: none; transform: none; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .linkbtn { background: none; border: 0; color: var(--wall-muted); text-decoration: underline; text-underline-offset: 4px; padding: 8px; font-size: 15px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
  .topbar .t { font: 600 14px var(--f-ui); color: var(--wall-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .iconbtn { background: var(--wall-raise); border: 1px solid var(--wall-line); color: var(--wall-text); border-radius: 10px; padding: 7px 12px; font: 600 14px var(--f-ui); white-space: nowrap; }

  /* ---------- paper ---------- */
  .paper {
    background-color: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    padding: 22px 18px;
    box-shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 6px 14px rgba(0, 0, 0, .3);
    font-family: var(--f-body);
    font-size: 17.5px;
    line-height: 1.95;
  }
  .paper p + p { margin-top: .6em; }
  .paper.slip { background-image: repeating-linear-gradient(180deg, transparent 0 33px, rgba(125, 98, 52, .14) 33px 34px); }
  .report-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    border-bottom: 1.5px solid var(--ink);
    padding-bottom: 8px; margin-bottom: 14px;
    font: 500 13px/1.5 var(--f-ui); color: var(--ink-soft);
  }
  .report-head b { color: var(--carbon); font-weight: 600; font-variant-numeric: tabular-nums; }
  .paper .title { font-family: var(--f-display); font-size: 32px; line-height: 1.3; color: var(--ink); }
  .paper .setting { font: 500 14px/1.6 var(--f-ui); color: var(--ink-soft); margin-top: 2px; }

  .stamp {
    display: inline-block;
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 22px;
    line-height: 1.3;
    color: var(--stamp);
    border: 3px double var(--stamp);
    border-radius: 7px;
    padding: 2px 14px 4px;
    transform: rotate(-6deg);
    opacity: .9;
    white-space: nowrap;
  }
  .stamp.blood { color: var(--blood); border-color: var(--blood); }
  .stamp.sm { font-size: 15px; padding: 0 9px 2px; border-width: 2.5px; }
  .stamp.big { font-size: 36px; padding: 4px 22px 8px; }
  .thud { animation: thud .42s cubic-bezier(.2, .9, .3, 1.2) both; }
  @keyframes thud { from { transform: rotate(-14deg) scale(2.1); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: .9; } }

  /* ---------- home ---------- */
  .cover {
    position: relative;
    background: var(--paper-2);
    color: var(--ink);
    border-radius: 14px;
    border-start-start-radius: 0; /* the tab sits on this corner, so it joins flush */
    padding: 26px 20px 22px;
    box-shadow: 0 6px 14px rgba(0, 0, 0, .3);
    margin-top: 22px;
  }
  html[lang="en"] .cover::before { content: "Case archive"; }
  .cover::before {
    content: "أرشيف القضايا";
    position: absolute; top: -26px; inset-inline-start: 0;
    background: var(--paper-2); color: var(--ink-soft);
    font: 600 12px/26px var(--f-ui);
    padding-inline: 14px; border-radius: 9px 9px 0 0;
  }
  .logo { font-family: var(--f-display); font-weight: 700; font-size: clamp(52px, 16vw, 84px); line-height: 1.1; color: var(--ink); margin: 0; }
  .logo-rule { height: 3px; width: 64%; background: var(--carbon); border-radius: 3px; margin: 6px 0 12px; opacity: .85; transform: rotate(-.6deg); }
  .cover .stamp { position: absolute; top: 22px; inset-inline-end: 16px; }
  .cover p { font-family: var(--f-body); font-size: 17px; line-height: 1.8; color: var(--ink-soft); max-width: 34ch; }
  .resume {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--wall-raise); border: 1px solid var(--wall-line);
    border-radius: 14px; padding: 14px;
  }
  .section-h { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }
  .section-h h2 { font: 700 18px var(--f-ui); }
  .section-h span { font-size: 13px; color: var(--wall-muted); }

  .folders { display: flex; flex-direction: column; gap: 30px; padding-top: 22px; }
  .folder {
    position: relative;
    display: block; width: 100%;
    text-align: start;
    background: var(--paper-2);
    color: var(--ink);
    border: 0;
    border-radius: 12px;
    border-start-start-radius: 0;
    padding: 16px 16px 14px;
    box-shadow: 0 6px 14px rgba(0, 0, 0, .3);
  }
  .folder::before {
    content: attr(data-tab);
    position: absolute; top: -24px; inset-inline-start: 0;
    background: var(--paper-2); color: var(--ink-soft);
    font: 600 12px/24px var(--f-ui);
    padding-inline: 12px; border-radius: 8px 8px 0 0;
    font-variant-numeric: tabular-nums;
  }
  .folder h3 { font-family: var(--f-display); font-size: 27px; line-height: 1.3; }
  .folder p { font-family: var(--f-body); font-size: 16px; line-height: 1.75; color: var(--ink-soft); margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 500 13px/1.4 var(--f-ui); padding: 3px 10px; border-radius: 99px; background: rgba(35, 30, 23, .08); color: var(--ink-soft); white-space: nowrap; }
  .chip.cul { background: rgba(95, 61, 140, .12); color: var(--stamp); font-weight: 600; }

  /* ---------- count ---------- */
  .stepper { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 10px 0; }
  .stepper button {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--wall-raise); border: 1.5px solid var(--wall-line);
    font: 600 32px/1 var(--f-ui); color: var(--wall-text);
  }
  .stepper button:disabled { opacity: .3; }
  .stepper output { font: 700 88px/1 var(--f-ui); min-width: 1.4em; text-align: center; font-variant-numeric: tabular-nums; color: var(--lamp); }
  .seats { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .seat { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--wall-line); }
  .seat.on { border: 0; background: var(--lamp); }

  /* ---------- names ---------- */
  .names { display: flex; flex-direction: column; gap: 10px; }
  .names label { display: flex; align-items: center; gap: 10px; background: var(--wall-raise); border: 1.5px solid var(--wall-line); border-radius: 12px; padding-inline: 14px; }
  .names label:focus-within { border-color: var(--lamp); }
  .names .n { font: 600 14px var(--f-ui); color: var(--wall-muted); min-width: 1.4em; font-variant-numeric: tabular-nums; }
  .names input { flex: 1; min-width: 0; background: transparent; border: 0; padding: 14px 0; font-size: 18px; outline: none; }
  .names input::placeholder { color: #6F8279; }
  .err { color: #F2A38F; font-size: 15px; min-height: 1.5em; }

  /* ---------- pass / handoff ---------- */
  .handoff { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding-block: 24px; }
  .handoff .to { font: 600 15px var(--f-ui); color: var(--wall-muted); }
  .handoff .who { font-family: var(--f-display); font-weight: 700; font-size: 58px; line-height: 1.2; color: var(--lamp); overflow-wrap: anywhere; }
  .handoff .note { color: var(--wall-muted); max-width: 30ch; }
  .dots { display: flex; gap: 6px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--wall-line); }
  .dots i.on { background: var(--lamp); }

  /* ---------- character card (recharge-card style) ---------- */
  .rcard {
    background: linear-gradient(140deg, var(--rcard-a), var(--rcard-b));
    color: var(--ink);
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 6px 14px rgba(0, 0, 0, .3);
    display: flex; flex-direction: column; gap: 12px;
  }
  .rcard-top, .rcard-foot { display: flex; justify-content: space-between; gap: 10px; font: 600 12px/1.4 var(--f-ui); color: var(--ink-soft); }
  .rcard-foot { font-weight: 500; }
  .scratch { position: relative; border-radius: 12px; overflow: hidden; min-height: 210px; background: var(--scratch-bg); display: grid; place-items: center; text-align: center; }
  .scratch:not(.ready) .under { visibility: hidden; }
  .scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; transition: opacity .55s ease; }
  .scratch.done canvas { opacity: 0; pointer-events: none; }
  .under { padding: 18px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .under .cname { font-family: var(--f-display); font-weight: 700; font-size: 44px; line-height: 1.2; color: var(--carbon); }
  .under .cjob { font: 500 15px var(--f-ui); color: var(--ink-soft); }
  .under .stamp { margin-top: 8px; }

  /* ---------- character sheet ---------- */
  .sheet { display: flex; flex-direction: column; gap: 20px; }
  .sheet h3 { font: 700 13px/1.4 var(--f-ui); letter-spacing: .04em; color: var(--stamp); margin-bottom: 4px; }
  .sheet ul, .sheet ol { margin: 0; padding-inline-start: 1.1em; }
  .sheet li + li { margin-top: .35em; }
  .tl { list-style: none; padding: 0 !important; display: flex; flex-direction: column; gap: 4px; }
  .tl li { display: grid; grid-template-columns: 4.6em 1fr; gap: 10px; margin: 0 !important; }
  .tl time { font: 600 14px/2.15 var(--f-ui); color: var(--carbon); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .alert { background: rgba(143, 44, 34, .08); border: 1.5px solid rgba(143, 44, 34, .45); border-radius: 8px; padding: 12px 14px; }
  .alert h3 { color: var(--blood); }
  .alert .partner { font-family: var(--f-ui); font-size: 16px; }
  .alert .partner b { color: var(--blood); }
  .crime h3 { color: var(--blood); }

  /* ---------- cast ---------- */
  .cast { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .cast li { position: relative; padding: 12px 0; border-bottom: 1px solid rgba(125, 98, 52, .28); }
  .cast li:last-child { border-bottom: 0; }
  .cast .pn { font-family: var(--f-display); font-size: 25px; line-height: 1.3; color: var(--carbon); }
  .cast .cn { font: 600 16px/1.5 var(--f-ui); color: var(--ink); }
  .cast .cn span { font-weight: 500; color: var(--ink-soft); }
  .cast p { font-size: 16px; line-height: 1.75; color: var(--ink-soft); }
  .cast li.out .pn, .cast li.out .cn { text-decoration: line-through; text-decoration-thickness: 2px; opacity: .6; }
  .cast li .stamp { position: absolute; top: 14px; inset-inline-end: 4px; }

  /* ---------- night ---------- */
  .night-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .night-head .h-display { font-size: 46px; color: var(--lamp); }
  .night-head .of { font: 500 14px var(--f-ui); color: var(--wall-muted); padding-bottom: 10px; }
  .pips { display: flex; gap: 6px; }
  .pips i { flex: 1; height: 6px; border-radius: 3px; background: var(--wall-line); }
  .pips i.done { background: var(--wall-muted); }
  .pips i.now { background: var(--lamp); }
  .status { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; color: var(--wall-muted); }
  .status b { color: var(--wall-text); font-variant-numeric: tabular-nums; }
  .lastnight { background: rgba(143, 44, 34, .22); border: 1px solid rgba(242, 163, 143, .35); color: #F6C9BD; border-radius: 10px; padding: 10px 12px; font-size: 15px; }

  .envelope {
    width: 100%; border: 0; position: relative;
    background: var(--paper-2); color: var(--ink);
    border-radius: 6px; padding: 38px 18px 30px;
    box-shadow: 0 6px 14px rgba(0, 0, 0, .3);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    overflow: hidden;
  }
  .envelope::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 58%;
    background: linear-gradient(to bottom right, transparent 49.5%, rgba(125, 98, 52, .22) 50%) left / 50% 100% no-repeat,
                linear-gradient(to bottom left, transparent 49.5%, rgba(125, 98, 52, .22) 50%) right / 50% 100% no-repeat;
  }
  .envelope .seal { position: relative; width: 74px; height: 74px; border-radius: 50%; background: var(--stamp); color: var(--paper); display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; box-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
  .envelope .lbl { position: relative; font: 600 16px var(--f-ui); }
  .slip { transform: rotate(-.8deg); animation: slip .45s ease-out both; }
  @keyframes slip { from { transform: translateY(24px) rotate(-3deg); opacity: 0; } to { transform: rotate(-.8deg); opacity: 1; } }
  .slip .hint { font-size: 20px; line-height: 1.9; }
  details.prev { background: var(--wall-raise); border: 1px solid var(--wall-line); border-radius: 12px; padding: 4px 14px; }
  details.prev summary { cursor: pointer; padding: 10px 0; font-weight: 600; }
  details.prev ol { margin: 0 0 12px; padding-inline-start: 1.3em; display: flex; flex-direction: column; gap: 8px; font-family: var(--f-body); font-size: 16px; line-height: 1.8; color: var(--wall-text); }

  .timerbox { background: var(--wall-raise); border: 1px solid var(--wall-line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .timerbox .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .timerbox .hd b { font-size: 15px; }
  .presets { display: flex; gap: 6px; }
  .presets button, .tctl button { background: transparent; border: 1px solid var(--wall-line); border-radius: 9px; padding: 5px 10px; font: 600 14px var(--f-ui); color: var(--wall-text); }
  .timer { font: 700 52px/1 var(--f-ui); text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .02em; direction: ltr; }
  .timer.over { color: #F2A38F; animation: blink 1s steps(2) 3; }
  @keyframes blink { 50% { opacity: .25; } }
  .tctl { display: flex; gap: 8px; justify-content: center; }
  .tctl button { padding: 7px 16px; }

  /* ---------- vote ---------- */
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: start;
    padding: 14px 16px; border-radius: 12px;
    background: var(--wall-raise); border: 1.5px solid var(--wall-line);
  }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice .pn { font: 700 19px var(--f-ui); }
  .choice .cn { font-size: 14px; color: var(--wall-muted); text-align: end; }
  .choice.on { border-color: var(--lamp); background: rgba(239, 194, 106, .13); }
  .choice:focus-within { outline: 3px solid var(--lamp); outline-offset: 2px; }
  .choice.skip { border-style: dashed; }
  button.choice { font: inherit; color: var(--wall-text); cursor: pointer; }
  button.choice:active { border-color: var(--lamp); background: rgba(239, 194, 106, .13); }
  /* multi-phone cases: the vote countdown and the player's own role */
  .mc-count { font: 700 64px/1 var(--f-ui); color: var(--lamp); text-align: center; font-variant-numeric: tabular-nums; direction: ltr; }
  .mc-count.sm { font-size: 34px; }
  .mc-role { display: flex; flex-direction: column; gap: 12px; }

  /* ---------- result ---------- */
  .tally { display: flex; flex-direction: column; gap: 12px; }
  .bar-row { display: grid; grid-template-columns: minmax(5em, 32%) 1fr 1.6em; align-items: center; gap: 10px; }
  .bar-row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .ct { font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .bar { position: relative; height: 14px; border-radius: 7px; background: var(--wall-raise); }
  .bar i { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 7px; background: var(--lamp); }
  .bar i.skipbar { background: var(--wall-muted); }
  .bar .need { position: absolute; top: -5px; bottom: -5px; width: 2px; background: #F2A38F; }
  .legend { font-size: 13px; color: var(--wall-muted); display: flex; align-items: center; gap: 8px; }
  .legend i { width: 2px; height: 14px; background: #F2A38F; display: inline-block; }
  .verdict { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
  .verdict .who { font-family: var(--f-display); font-size: 38px; line-height: 1.25; color: var(--carbon); }
  .verdict .as { font: 500 15px var(--f-ui); color: var(--ink-soft); }

  /* ---------- end ---------- */
  .end-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding-block: 8px; }
  .end-head .h-display { font-size: 38px; color: var(--ink); }
  .who-did { display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--f-ui); text-align: center; }
  .who-did > span { font-size: 14px; color: var(--ink-soft); }
  .who-did p { margin: 0; display: flex; flex-direction: column; align-items: center; }
  .who-did b { font-size: 26px; line-height: 1.25; color: var(--blood); }
  .who-did small { font-size: 13px; color: var(--ink-soft); }

  /* ---------- rules ---------- */
  .steps { margin: 0; padding-inline-start: 1.3em; display: flex; flex-direction: column; gap: 10px; }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 10; background: rgba(6, 14, 12, .72); display: grid; place-items: end center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .modal .box { position: relative; width: 100%; max-width: 480px; max-height: calc(100vh - 32px - env(safe-area-inset-bottom, 0px)); max-height: calc(100dvh - 32px - env(safe-area-inset-bottom, 0px)); background: var(--wall); border: 1px solid var(--wall-line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  /* a long popup (like «الجديد») scrolls inside; its buttons and the ✕ never leave the screen */
  .modal .m-body { display: flex; flex-direction: column; gap: 12px; min-height: 0; flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; margin: -4px -6px; padding: 4px 6px; }
  .modal .m-acts { display: flex; flex-direction: column; gap: 10px; flex: none; }
  .modal .m-x { position: absolute; top: 10px; inset-inline-end: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--wall-line); background: var(--wall-raise); color: var(--wall-text); font: 700 16px var(--f-ui); line-height: 1; display: grid; place-items: center; z-index: 1; }
  .modal h2 { font: 700 19px var(--f-ui); padding-inline-end: 40px; }
  .modal p { color: var(--wall-muted); }
  .modal .paper p { color: var(--ink); } /* evidence on paper inside a popup stays ink-dark, not the wall's grey */

  /* ---------- motion: small, tactile, on-theme ---------- */
  .btn, .iconbtn, .folder, .choice, .envelope, .stepper button, .presets button, .tctl button, .linkbtn, .seg button {
    transition: transform .18s cubic-bezier(.2, .8, .3, 1.2), background-color .18s ease, border-color .18s ease, color .18s ease;
  }
  @media (hover: hover) {
    .btn.primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 0 var(--lamp-deep), 0 4px 10px rgba(239, 194, 106, .14); }
    .btn.ghost:hover:not(:disabled), .iconbtn:hover { border-color: var(--wall-muted); background-color: rgba(236, 229, 210, .05); }
    .btn.danger:hover { transform: translateY(-1px); }
    .folder:hover { transform: translateY(-3px) rotate(-.35deg); box-shadow: 0 6px 14px rgba(0, 0, 0, .3); }
    .choice:hover { border-color: var(--wall-muted); }
    .envelope:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0, 0, 0, .3); }
    .envelope:hover .seal { transform: rotate(-8deg) scale(1.05); }
    .stepper button:hover:not(:disabled), .presets button:hover, .tctl button:hover { border-color: var(--lamp); color: var(--lamp); }
    .linkbtn:hover { color: var(--wall-text); }
  }
  .btn:active:not(:disabled) { transform: translateY(2px) scale(.985); }
  .btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--lamp-deep); }
  .folder:active, .choice:active { transform: scale(.985); }
  .iconbtn:active, .presets button:active, .tctl button:active, .seg button:active { transform: scale(.94); }
  .stepper button:active:not(:disabled) { transform: scale(.88); }
  .envelope:active { transform: scale(.98); }
  .envelope .seal { transition: transform .25s cubic-bezier(.2, .8, .3, 1.3); }
  .choice.on { animation: pick .22s ease-out; }
  @keyframes pick { 40% { transform: scale(1.02); } }
  .bump { animation: bump .22s cubic-bezier(.2, .8, .3, 1.4); }
  @keyframes bump { from { transform: scale(1.18); } }
  .screen.enter { animation: enter .24s ease-out both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }

  /* ---------- full / short sheet toggle ---------- */
  .seg { display: flex; background: var(--wall-raise); border: 1px solid var(--wall-line); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; border: 0; border-radius: 9px; padding: 9px 10px; background: transparent; color: var(--wall-muted); font: 600 15px var(--f-ui); }
  .seg button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 0 rgba(0, 0, 0, .2); }
  /* ---------- cabinet: category drawers + case covers ---------- */
  .drawers { display: flex; flex-direction: column; gap: 14px; }
  .drawer {
    position: relative; width: 100%; text-align: start; border: 0; border-radius: 14px;
    background: var(--paper-2); color: var(--ink); padding: 22px 16px 14px;
    box-shadow: 0 6px 14px rgba(0, 0, 0, .3); display: flex; flex-direction: column; gap: 4px;
  }
  .drawer.off { opacity: .55; }
  .drawer::after { content: ""; position: absolute; top: 9px; left: 50%; width: 54px; height: 7px; margin-left: -27px; border-radius: 4px; background: rgba(35, 30, 23, .2); }
  .drawer-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .drawer h3 { font-family: var(--f-display); font-size: 28px; line-height: 1.3; }
  .drawer .count { font: 600 13px var(--f-ui); color: var(--ink-soft); white-space: nowrap; }
  .drawer p { font-family: var(--f-body); font-size: 15px; line-height: 1.7; color: var(--ink-soft); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .thumb { width: 62px; aspect-ratio: 3 / 2; background: var(--paper-2); border-radius: 6px; padding: 2px; box-shadow: inset 0 0 0 1.5px rgba(35, 30, 23, .18); }
  .thumb svg, .art svg, .count-art svg { width: 100%; height: 100%; display: block; }
  .covers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .cover-card {
    position: relative; display: flex; flex-direction: column; gap: 3px; text-align: start; border: 0; border-radius: 12px;
    background: var(--paper-2); color: var(--ink); padding: 10px 10px 12px; box-shadow: 0 6px 14px rgba(0, 0, 0, .3);
  }
  .cover-card .art { aspect-ratio: 3 / 2; border-radius: 8px; background: var(--paper-2); box-shadow: inset 0 0 0 1.5px rgba(35, 30, 23, .2); padding: 4px; }
  .cover-card .range {
    position: absolute; top: 4px; inset-inline-start: 4px; background: var(--stamp); color: var(--paper);
    font: 700 12px/1.4 var(--f-ui); padding: 3px 8px; border-radius: 6px; transform: rotate(-4deg); box-shadow: 0 2px 0 rgba(0, 0, 0, .25);
  }
  .cover-card .ct { font-family: var(--f-display); font-size: 21px; line-height: 1.3; margin-top: 4px; }
  .cover-card .cm { font: 500 12px/1.5 var(--f-ui); color: var(--ink-soft); }
  .cover-card .cs { font: 600 12px/1.5 var(--f-ui); color: var(--ink-soft); }
  .cover-card .cs.new { color: var(--stamp); }
  .count-art { width: 150px; aspect-ratio: 3 / 2; margin-inline: auto; background: var(--paper-2); border-radius: 10px; padding: 6px; box-shadow: 0 6px 14px rgba(0, 0, 0, .3); }
  .drawer, .cover-card { transition: transform .18s cubic-bezier(.2, .8, .3, 1.2); }
  @media (hover: hover) { .drawer:hover, .cover-card:hover { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(0, 0, 0, .3); } }
  .drawer:active, .cover-card:active { transform: scale(.985); }

  /* ---------- settings / scoreboard / questions ---------- */
  .setgroup { display: flex; flex-direction: column; gap: 10px; }
  .setgroup h2 { font: 700 17px var(--f-ui); }
  .btn.sm { font-size: 15px; padding: 12px 6px; }
  .board { width: 100%; border-collapse: collapse; font-family: var(--f-ui); font-size: 15px; }
  .board th { font-size: 12px; color: var(--ink-soft); font-weight: 600; text-align: start; padding: 6px 4px; border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
  .board td { padding: 8px 4px; border-bottom: 1px solid rgba(125, 98, 52, .25); font-variant-numeric: tabular-nums; }
  .board td:first-child { font-family: var(--f-display); font-size: 20px; color: var(--carbon); }
  .qs { margin: 0 0 12px; padding-inline-start: 1.2em; display: flex; flex-direction: column; gap: 6px; color: var(--wall-text); }

  /* ---------- text size + big-screen (TV) mode ---------- */
  #app.tv .hint { font-size: 25px; }
  #app.tv .night-head .h-display { font-size: 60px; }
  #app.tv .verdict .who { font-size: 50px; }
  #app.tv .timer { font-size: 72px; }

  /* ---------- game modes ---------- */
  .modes { display: flex; flex-direction: column; gap: 14px; }
  .mode {
    position: relative; width: 100%; text-align: start; border: 0; border-radius: 16px; padding: 18px 16px;
    background: var(--paper-2); color: var(--ink); box-shadow: 0 6px 14px rgba(0, 0, 0, .3);
    display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center;
  }
  .mode .ic { width: 76px; aspect-ratio: 3 / 2; }
  .mode .ic svg { width: 100%; height: 100%; display: block; }
  .mode h3 { font-family: var(--f-display); font-size: 27px; line-height: 1.25; }
  .mode p { font-family: var(--f-body); font-size: 15px; line-height: 1.7; color: var(--ink-soft); }
  .mode.locked { background: var(--wall-raise); color: var(--wall-muted); box-shadow: none; border: 1.5px dashed var(--wall-line); cursor: default; }
  .mode.locked h3 { color: var(--wall-text); }
  .mode.locked p { color: var(--wall-muted); }
  .mode .lock { position: absolute; top: 12px; inset-inline-end: 12px; font: 700 12px var(--f-ui); background: var(--wall-line); color: var(--wall-text); padding: 3px 10px; border-radius: 99px; }
  .mode, .mode .ic { transition: transform .18s cubic-bezier(.2, .8, .3, 1.2); }
  @media (hover: hover) { .mode:not(.locked):hover { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(0, 0, 0, .3); } }
  .mode:not(.locked):active { transform: scale(.985); }

  /* ---------- filters ---------- */
  .filters { display: flex; flex-direction: column; gap: 10px; }
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .fchip { border: 1.5px solid var(--wall-line); background: transparent; color: var(--wall-text); border-radius: 99px; padding: 6px 12px; font: 600 14px var(--f-ui); transition: background-color .16s, border-color .16s, transform .16s; }
  .fchip.on { background: var(--lamp); border-color: var(--lamp); color: var(--ink); }
  .fchip:active { transform: scale(.94); }
  .sr-plan { display: flex; flex-direction: column; gap: 8px; }
  .sr-round { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .sr-round > span:first-child { font: 700 15px var(--f-ui); }
  .sahra-card { border: 1.5px solid var(--lamp-deep); border-radius: 14px; padding: 12px; background: rgba(239, 194, 106, .07); }
  .sahra-card h2 { font: 700 17px var(--f-ui); }
  .sahra-on { border-color: var(--lamp-deep); }
  .sr-rank li.star .pn { color: var(--blood); }
  .sr-rounds { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; font-family: var(--f-ui); }
  .sr-rounds li:not(.done) { color: var(--ink-soft); }
  .nb-list { display: flex; flex-direction: column; gap: 8px; }
  .nb-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--wall-line); }
  .nb-row.out .nb-n { opacity: .6; }
  .nb-n small { color: var(--wall-muted); }
  .fchip.nb-sus.on { background: var(--blood); border-color: var(--blood); color: #fff; }
  .fchip.nb-ok.on { background: #3E7A4F; border-color: #3E7A4F; color: #fff; }
  .nb-tag { font: 700 12px var(--f-ui); padding: 1px 8px; border-radius: 99px; color: #fff; background: var(--blood); }
  .nb-tag.nb-ok { background: #3E7A4F; }
  .modal .field textarea#nb-text { min-height: 120px; }
  .flabel { font: 600 13px var(--f-ui); color: var(--wall-muted); }
  .empty { text-align: center; color: var(--wall-muted); padding: 24px 0; }
  .moodtags { display: flex; flex-wrap: wrap; gap: 4px; }
  .moodtags span { font: 600 11px var(--f-ui); color: var(--stamp); background: rgba(95, 61, 140, .1); padding: 1px 7px; border-radius: 99px; }
  /* horror cases: a "true story" stamp on the report, and a lamp that flickers on the night title */
  .truestamp { display: inline-block; margin: 6px 0 2px; padding: 3px 10px; border: 2px solid var(--blood); color: var(--blood); font: 700 13px var(--f-ui); transform: rotate(-2deg); border-radius: 3px; }
  .night-head.horror .h-display { animation: flicker 5s steps(1) infinite; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 42% { opacity: .35; } 44% { opacity: 1; } 47% { opacity: .5; } 49% { opacity: 1; } 81% { opacity: .2; } 83% { opacity: 1; } }

  /* ---------- steps tracker ---------- */
  .steps-bar { display: flex; gap: 6px; align-items: center; font: 600 12px var(--f-ui); color: var(--wall-muted); flex-wrap: wrap; }
  .steps-bar span { padding: 3px 9px; border-radius: 99px; border: 1px solid var(--wall-line); }
  .steps-bar span.on { background: var(--lamp); color: var(--ink); border-color: var(--lamp); }
  .ghostnote { background: rgba(167, 182, 172, .12); border: 1px dashed var(--wall-muted); border-radius: 10px; padding: 10px 12px; font-size: 15px; }

  /* ---------- evidence documents ---------- */
  .ev.cctv {
    background-color: #0B100F; color: #D5F2CE; border-radius: 6px; padding: 12px 14px; font-family: var(--f-ui);
    background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, .045) 0 1px, transparent 1px 3px);
    box-shadow: 0 6px 14px rgba(0, 0, 0, .3); border: 1px solid #25302D;
  }
  .ev .ev-top, .ev .ev-bot { display: flex; justify-content: space-between; gap: 10px; font: 600 12px/1.4 var(--f-ui); opacity: .85; }
  .ev.cctv .rec { color: #FF5A4F; animation: blink 1.2s steps(2) infinite; }
  .ev.cctv .hint { margin: 10px 0; font-family: var(--f-ui); }
  .ev.phone { background: #E7DED3; color: #1B1B1B; border-radius: 18px; padding: 12px; box-shadow: 0 6px 14px rgba(0, 0, 0, .3); }
  .ev.phone .ev-top { color: #4A4A4A; }
  .ev.phone .bubble { background: #FFFFFF; border-radius: 14px; border-start-start-radius: 3px; padding: 10px 12px; margin-top: 8px; font: 500 18px/1.85 var(--f-ui); box-shadow: 0 1px 0 rgba(0, 0, 0, .15); }
  .ev.lab { position: relative; padding-bottom: 46px; }
  .ev.lab .stamp { position: absolute; bottom: 12px; inset-inline-end: 14px; }
  .ev.receipt {
    background: #FBFAF4; color: #222; padding: 16px 18px; width: 100%; max-width: 380px; margin-inline: auto;
    font-family: var(--f-ui); border-top: 2px dashed #9A9A92; border-bottom: 2px dashed #9A9A92; box-shadow: 0 6px 14px rgba(0, 0, 0, .3);
  }
  .ev.receipt .hint { font-size: 18px; margin: 10px 0; }
  .ev.phone .pl, .ev.receipt .pl { color: var(--stamp); }
  .ev.cctv .pl { color: #F2C46D; }

  /* ---------- awards / truth file / share ---------- */
  .awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .fam-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .fam-row small { color: var(--wall-muted); font: 500 12px var(--f-ui); }
  .fam-swap { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; align-items: center; margin-bottom: 8px; }
  .fam-swap span { font: 500 13px var(--f-ui); color: var(--wall-muted); }
  .fam-item .row { flex-wrap: wrap; }
  .fam-item .row .btn { flex: 1 1 28%; min-width: 0; padding-inline: 10px; }
  .paper .btn.ghost { color: var(--ink); border-color: rgba(40, 30, 20, .35); }
  .tvb { text-align: center; align-items: center; }
  .tvb .topbar { width: 100%; }
  .tv-big { font: 700 clamp(34px, 7vw, 72px)/1.25 var(--f-display); color: var(--lamp); margin: 0; }
  .tv-mid { font: 600 clamp(18px, 3vw, 30px)/1.5 var(--f-ui); color: var(--wall-text); margin: 0; }
  .tv-eyebrow { font: 600 clamp(15px, 2.4vw, 24px) var(--f-ui); color: var(--wall-muted); margin: 0; }
  .tv-paper { max-width: 900px; width: 100%; text-align: start; }
  .tv-clue { font: 500 clamp(20px, 3.4vw, 36px)/1.7 var(--f-body); }
  .tv-names { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tv-names li { background: var(--wall-raise); border: 1px solid var(--wall-line); border-radius: 999px; padding: 6px 14px; font: 600 clamp(14px, 2vw, 22px) var(--f-ui); }
  .tv-names li.out { opacity: .55; text-decoration: line-through; }
  .icb-row { display: flex; align-items: center; gap: 6px; }
  .icb { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; padding: 0; background: var(--wall-raise); border: 1px solid var(--wall-line); color: var(--wall-text); flex-shrink: 0; }
  .icb svg { width: 22px; height: 22px; }
  .icb svg[viewBox="0 0 30 20"] { width: 24px; height: 16px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.2); }
  .icb.snd-btn[aria-pressed="false"] { color: var(--wall-muted); }
  .stu-f { display: grid; gap: 4px; margin-bottom: 10px; }
  .stu-f b { font: 700 14px var(--f-ui); }
  .stu-f small { font: 500 12px var(--f-ui); color: var(--wall-muted); }
  .stu-ch { display: grid; gap: 8px; margin-bottom: 10px; }
  .stu-2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .stu-steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .stu-steps button { flex: none; border: 1px solid var(--wall-muted); background: transparent; color: inherit; border-radius: 999px; padding: 6px 10px; font: 600 13px var(--f-ui); }
  .stu-steps button.on { background: var(--stamp); border-color: var(--stamp); color: #fff; }
  .by-author { font: 600 13px var(--f-ui); color: var(--stamp); margin: 4px 0 0; }
  .dev-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; align-items: center; }
  .dev-row .input { min-width: 0; }
  .chatbtn { position: relative; flex: 0 0 auto; padding-inline: 12px; }
  .chat-badge { position: absolute; top: -6px; left: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--blood); color: #fff; font: 700 11px/18px var(--f-ui); text-align: center; padding: 0 4px; }
  #chat-fx { position: fixed; top: calc(62px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(92vw, 420px); display: flex; flex-direction: column; gap: 6px; z-index: 60; pointer-events: none; }
  .chat-bub { align-self: center; max-width: 100%; background: var(--paper); color: var(--ink); border: 1px solid var(--paper-line); border-inline-start: 5px solid var(--lamp-deep); border-radius: 14px; padding: 8px 14px; font: 600 15px/1.5 var(--f-ui); text-align: start; box-shadow: 0 6px 16px rgba(0,0,0,.4); overflow-wrap: anywhere; transition: opacity .4s, transform .4s; animation: bubIn .25s ease-out; pointer-events: auto; cursor: pointer; }
  .chatbtn.new { border-color: var(--lamp); animation: chatPulse 1.4s ease-in-out infinite; }
  @keyframes chatPulse { 50% { box-shadow: 0 0 0 4px rgba(239, 194, 106, .28); } }
  .chat-last { display: flex; align-items: baseline; gap: 6px; width: 100%; background: var(--paper); color: var(--ink); border: 1px solid var(--paper-line); border-radius: 10px; padding: 6px 10px; font: 600 14px/1.5 var(--f-ui); text-align: start; overflow: hidden; }
  .chat-last span[dir] { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-last i { margin-inline-start: auto; font-style: normal; font-weight: 700; color: var(--blood); }
  .chat-bub.out { opacity: 0; transform: translateY(-6px); }
  @keyframes bubIn { from { opacity: 0; transform: translateY(-8px); } }
  #chat-sheet { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  #chat-sheet[hidden] { display: none; }
  .chat-box { width: min(100%, 520px); max-height: 82vh; display: flex; flex-direction: column; gap: 10px; background: var(--wall-raise); border: 1px solid var(--wall-line); border-radius: 18px 18px 0 0; padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); color: var(--wall-text); }
  .chat-top { display: flex; align-items: center; gap: 10px; }
  .chat-top b { font: 700 18px var(--f-ui); margin-inline-end: auto; }
  .chat-log { min-height: 90px; max-height: 34vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }

  .chat-emo { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
  .chat-emo button { border: 0; background: var(--wall-deep); border-radius: 10px; font-size: 22px; padding: 6px 0; }
  .chat-lines { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .chat-lines button { flex: none; border: 1.5px solid var(--wall-line); background: transparent; color: var(--wall-text); border-radius: 999px; padding: 6px 12px; font: 600 13px var(--f-ui); }
  .chat-type { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }

  .ver-foot { text-align: center; font: 500 12px var(--f-ui); color: var(--wall-muted); margin: -6px 0 0; padding: 6px 0; opacity: .8; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

  .tile { display: flex; flex-direction: column; gap: 3px; text-align: start; padding: 12px 14px; border-radius: 14px; border: 1.5px dashed var(--lamp); background: rgba(239, 194, 106, .08); color: var(--wall-muted); font: 500 13px/1.5 var(--f-ui); }
  .tile b { font: 700 16px/1.3 var(--f-ui); color: var(--lamp); }
  .kids-chip { margin-inline-start: auto; margin-inline-end: 8px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--wall-line); background: var(--wall-raise); color: var(--wall-muted); font: 600 12px var(--f-ui); }

  .wq-g { flex: none; border: 1.5px solid var(--wall-line); background: transparent; color: var(--wall-muted); border-radius: 99px; padding: 5px 12px; font: 600 13px var(--f-ui); }
  .wq-g.f { border-color: var(--lamp); color: var(--lamp); }
  .wq-kinds { flex-wrap: wrap; } .wq-kinds button { flex: 1 1 40%; }
  .wq-card { text-align: center; gap: 10px; }
  .wq-card .report-head { text-align: start; }
  .wq-who { font: 600 16px var(--f-ui); color: var(--ink-soft); }

  .wq-ask { font: 600 16px var(--f-ui); color: var(--ink-soft); }
  .wq-ask.small { font-size: 14px; }
  .wq-word { font: 700 clamp(34px, 11vw, 52px)/1.25 var(--f-display); color: var(--ink); text-wrap: balance; padding-block: 4px 8px; }
  .wq-q { font: 700 clamp(22px, 6.4vw, 28px)/1.6 var(--f-body); color: var(--ink); text-wrap: balance; }
  .wq-names { justify-content: center; gap: 8px; }
  .wq-names .fchip { font-size: 16px; padding: 9px 16px; display: inline-flex; align-items: center; gap: 6px; }
  .wq-k { font-style: normal; background: var(--ink); color: var(--paper); border-radius: 50%; width: 22px; height: 22px; display: inline-grid; place-items: center; font: 700 12px var(--f-ui); }
  .wq-rank { margin: 0; padding: 12px 16px; padding-inline-start: 2.2em; background: var(--wall-raise); border: 1px solid var(--wall-line); border-radius: 12px; font: 600 18px/1.9 var(--f-ui); }
  .wq-rank li:first-child { color: var(--lamp); font-size: 22px; }
  .wq-def, .wq-chosen { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font: 600 17px var(--f-ui); }
  .wq-def b { font: 700 44px var(--f-ui); color: var(--lamp); font-variant-numeric: tabular-nums; }
  .wq-def p b, .wq-chosen p b { font-size: inherit; }
  .wq-cd { text-align: center; font: 700 88px/1.1 var(--f-display); color: var(--lamp); }
  .wq-cd.go { font-size: 56px; color: var(--paper); animation: thud .42s cubic-bezier(.2, .9, .3, 1.2) both; }
  .mc-pickbar { display: flex; align-items: center; gap: 10px; } .mc-pickbar .btn { flex: 1; } .mc-pickbar .kids-chip { flex: none; margin: 0; padding: 8px 14px; font-size: 13px; }
  .kids-toggle { display: flex; flex-direction: column; gap: 2px; text-align: start; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--wall-line); background: var(--wall-raise); color: var(--wall-text); font: 500 13px/1.5 var(--f-ui); margin-bottom: 10px; }
  .kids-toggle b { font: 700 15px var(--f-ui); }

  .kids-toggle.on b { color: var(--lamp); }
  .spy-box { background: var(--paper); border: 2px dashed var(--carbon); border-radius: 12px; padding: 12px 14px; margin: 10px 0; color: var(--ink); font: 500 15px/1.7 var(--f-ui); }
  .spy-box > b { color: var(--carbon); font-size: 17px; }
  .spy-box p { margin: 6px 0 0; }
  .rp { list-style: none; padding: 0; margin: 4px 0; display: flex; flex-direction: column; gap: 4px; font: 500 14px/1.6 var(--f-ui); }
  .rp span { color: var(--ink-soft); }
  .rp-cul { color: var(--blood); }
  .rp-ok { color: var(--stamp); font-weight: 700; }
  .rp-n { font: 700 15px var(--f-ui); margin: 10px 0 2px; color: var(--carbon); }
  .rp-out { font: 600 14px var(--f-ui); margin: 2px 0 6px; }
  .shop-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .shop-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border-radius: 12px; background: var(--wall-raise); border: 2px solid var(--wall-line); color: var(--wall-text); font: 600 13px var(--f-ui); cursor: pointer; }
  .shop-item.on { border-color: var(--lamp); }

  .shop-item small svg { width: 14px; height: 14px; }
  .shop-sw { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); display: grid; place-items: center; font-size: 22px; line-height: 1; color: var(--ink-soft); }
  .pbadge { margin-inline-start: 6px; font-size: .95em; }
  .award { background: var(--paper); color: var(--ink); border-radius: 12px; padding: 12px; text-align: center; box-shadow: 0 6px 14px rgba(0, 0, 0, .3); display: flex; flex-direction: column; gap: 2px; }
  .award .at { font: 700 13px var(--f-ui); color: var(--stamp); }
  .award .an { font-family: var(--f-display); font-size: 26px; line-height: 1.3; color: var(--carbon); }
  .award .ad { font: 500 12px/1.5 var(--f-ui); color: var(--ink-soft); }
  .truth h3 { font: 700 13px/1.4 var(--f-ui); color: var(--stamp); margin: 10px 0 6px; }
  .truth .miss { color: var(--blood); font: 700 12px var(--f-ui); }
  .shot { width: 100%; border-radius: 12px; display: block; }
  .field { display: flex; flex-direction: column; gap: 6px; }

  .field input, .field textarea, .field select {
    width: 100%; background: var(--wall-raise); border: 1.5px solid var(--wall-line); border-radius: 12px;
    padding: 12px 14px; font: 500 17px/1.7 var(--f-ui); color: var(--wall-text); outline: none;
  }
  .field textarea { min-height: 170px; resize: vertical; }
  .input { display: block; width: 100%; min-width: 0; background: var(--wall-raise); border: 1.5px solid var(--wall-line); border-radius: 12px; padding: 11px 14px; font: 500 16px/1.6 var(--f-ui); color: var(--wall-text); outline: none; }
  .input:focus { border-color: var(--lamp); }
  textarea.input { resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--lamp); }
  .count-hint { font: 500 12px var(--f-ui); color: var(--wall-muted); }

  /* ---------- profiles ---------- */
  .ava { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; font: 700 16px var(--f-ui); flex: none; }
  .ava.lg { width: 72px; height: 72px; font-size: 32px; }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; }

  .badge span { font: 500 12px var(--f-ui); color: var(--ink-soft); }

  .qnames { display: flex; flex-wrap: wrap; gap: 6px; }
  .board tr[data-act] { cursor: pointer; }

  /* ---------- court mode ---------- */
  .court-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn.side-pros { border-color: #B98A8A; }
  .btn.side-def { border-color: #8AA7B9; }

  .tok { font-weight: 700; }
  .paper .tok { color: var(--carbon); }
  .pl { font: 600 .82em var(--f-ui); color: var(--lamp); white-space: nowrap; }
  .paper .pl { color: var(--stamp); }
  .who-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 12px; background: var(--wall-raise); border: 1px solid var(--wall-line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .who-list span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--wall-muted); }
  .who-list b { color: var(--wall-text); }
  .who-list .out { text-decoration: line-through; opacity: .55; }
  .times { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .times li { display: grid; grid-template-columns: 5.2em 1fr; gap: 12px; align-items: baseline; }
  .times time { font: 700 20px/1.3 var(--f-ui); color: var(--carbon); font-variant-numeric: tabular-nums; direction: ltr; text-align: end; white-space: nowrap; }
  .rolling { animation: shake .12s linear infinite; }
  @keyframes shake { 25% { transform: translateX(-2px) rotate(-.4deg); } 75% { transform: translateX(2px) rotate(.4deg); } }
  .sum { display: flex; flex-direction: column; gap: 6px; }
  .sum li { padding-inline-start: 2px; }
  .sum li::marker { color: var(--stamp); }

  /* ---------- multi-phone room: the join link the host shares ---------- */
  .room-pin { display: flex; align-items: center; justify-content: space-between; gap: 12px; font: 600 15px var(--f-ui); color: var(--ink-soft); }
  .room-pin b { font: 700 46px/1 var(--f-ui); color: var(--carbon); letter-spacing: .14em; font-variant-numeric: tabular-nums; direction: ltr; }
  .room-link {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1.5px dashed rgba(35, 30, 23, .35); background: rgba(35, 30, 23, .05);
    font: 600 15px/1.5 var(--f-ui); color: var(--carbon); text-align: left; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all;
  }
  .room-alt { font: 500 13px/1.6 var(--f-ui); color: var(--ink-soft); margin-top: 10px; }
  .room-alt span { display: block; direction: ltr; text-align: left; color: var(--carbon); overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
  .room-btns { display: flex; flex-direction: column; gap: 10px; }
  .pin-ok { display: flex; align-items: center; gap: 12px; background: var(--wall-raise); border: 1.5px solid var(--wall-line); border-radius: 12px; padding: 10px 14px; font: 600 14px var(--f-ui); }
  .pin-ok b { font: 700 24px/1 var(--f-ui); letter-spacing: .12em; color: var(--lamp); font-variant-numeric: tabular-nums; direction: ltr; }
  .pin-ok .ok { color: #9FD8A9; font-weight: 500; margin-inline-start: auto; }
  .toast {
    position: fixed; z-index: 20; inset-inline: 16px; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); max-width: 480px; margin-inline: auto;
    background: var(--paper); color: var(--ink); border-radius: 12px; padding: 12px 16px; box-shadow: 0 6px 18px rgba(0, 0, 0, .45);
    font: 600 15px/1.6 var(--f-ui); text-align: center; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  }
  .toast.on { opacity: 1; transform: none; }
  /* host lobby: the PIN is the main thing (friends with the app type it in) */
  .room-pin.big { flex-direction: column; justify-content: center; gap: 4px; padding: 6px 0 2px; }
  .room-pin.big b { font-size: 60px; letter-spacing: .2em; user-select: all; -webkit-user-select: all; }
  /* the in-app join while the room finder runs */
  .finding { display: flex; align-items: center; gap: 12px; background: var(--wall-raise); border: 1.5px solid var(--wall-line); border-radius: 12px; padding: 12px 14px; font: 600 15px/1.5 var(--f-ui); }
  .finding i { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--wall-line); border-top-color: var(--lamp); animation: spin .9s linear infinite; }
  .finding b { margin-inline-start: auto; font-variant-numeric: tabular-nums; color: var(--lamp); }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ---------- online room: the code, the server browser and the voice bar ---------- */
  .room-code { display: flex; flex-direction: column; align-items: center; gap: 2px; font: 600 15px var(--f-ui); color: var(--ink-soft); }
  .room-code b { font: 700 44px/1.15 var(--f-ui); color: var(--carbon); letter-spacing: .12em; direction: ltr; white-space: nowrap; font-variant-numeric: tabular-nums; user-select: all; -webkit-user-select: all; }
  .room-code b i { display: inline-block; width: .3em; }
  .room-note { font: 500 14px/1.6 var(--f-ui); color: var(--ink-soft); text-align: center; margin-top: 8px; }
  .field input.code-in { direction: ltr; text-align: center; text-transform: uppercase; letter-spacing: .18em; font-weight: 700; font-size: 22px; }
  .field input.code-in::placeholder { letter-spacing: normal; text-transform: none; font-weight: 500; font-size: 16px; }
  .olrooms { display: flex; flex-direction: column; gap: 10px; }
  .olroom { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: start; background: var(--paper); color: var(--ink); border: 0; border-radius: 12px; padding: 12px 14px; box-shadow: 0 2px 0 rgba(0, 0, 0, .25); font-family: var(--f-ui); }
  .olroom:active { transform: translateY(1px); box-shadow: none; }
  .olroom .rn { font: 700 18px/1.4 var(--f-ui); color: var(--carbon); overflow-wrap: anywhere; }

  .olroom .rc { grid-row: 1 / span 3; grid-column: 2; align-self: center; font: 700 20px/1 var(--f-ui); color: var(--ink); font-variant-numeric: tabular-nums; direction: ltr; }

  .ol-empty { text-align: center; color: var(--wall-muted); font: 500 15px/1.7 var(--f-ui); padding: 18px 8px; border: 1.5px dashed var(--wall-line); border-radius: 12px; }
  .olpick .rn { font: 700 22px/1.4 var(--f-ui); color: var(--carbon); margin: 6px 0 2px; }
  .olpick .rh { font: 500 14px var(--f-ui); color: var(--ink-soft); }
  .vcbar { display: flex; flex-direction: column; gap: 8px; background: var(--wall-raise); border: 1px solid var(--wall-line); border-radius: 12px; padding: 8px; }
  .vcbtns { display: flex; gap: 8px; }
  .vcbtn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--wall-line); background: transparent; color: var(--wall-text); border-radius: 9px; padding: 8px 6px; font: 700 14px var(--f-ui); }
  .vcbtn.on { background: rgba(78, 154, 98, .18); border-color: #4E9A62; }
  .vcbtn.off { background: rgba(164, 52, 38, .16); border-color: var(--blood); color: #F2A38F; }
  .vcbtn:active { transform: scale(.96); }
  .vcbtn i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
  .vcwho { display: flex; flex-wrap: wrap; gap: 6px; }
  .vccode { display: flex; align-items: center; gap: 8px; background: none; border: 1px dashed var(--wall-line); border-radius: 10px; padding: 6px 10px; font: 600 13px var(--f-ui); color: var(--wall-muted); text-align: start; }
  .vccode b { font: 700 15px var(--f-ui); color: var(--lamp); letter-spacing: .1em; direction: ltr; unicode-bidi: isolate; }
  .vccode i { font-style: normal; margin-inline-start: auto; color: var(--lamp); text-decoration: underline; text-underline-offset: 3px; }

  .vcp i { width: 8px; height: 8px; border-radius: 50%; background: var(--wall-line); transition: background-color .12s, box-shadow .12s; }
  .vcp.ok, .vcp.me { color: var(--wall-text); }
  .vcp.ok i, .vcp.me i { background: #4E9A62; }

  .vcp.fail { color: #F2A38F; }
  .vcp.fail i { background: var(--blood); }
  .vcp.off { opacity: .55; }
  .vcp.talk i { background: #7CF29A; box-shadow: 0 0 0 3px rgba(124, 242, 154, .35); }
  .vcnote { background: none; border: 0; padding: 0; text-align: start; font: 600 13px/1.5 var(--f-ui); color: #F2A38F; text-decoration: underline; text-underline-offset: 3px; }
  p.vcnote { text-decoration: none; color: var(--wall-muted); }
  /* «مين مين في المحكمة»: everyone's public role */
  .cast.whois .cn { font-weight: 700; color: var(--stamp); }
  .cast.whois p { font: 500 15px/1.6 var(--f-ui); margin-top: 2px; }
  /* «الراوي»: riddle cards, the Game Master's sheet and the end screen */
  .fi-card { min-height: 112px; }
  .fi-card .fi-done { align-self: flex-end; margin-top: auto; }
  .fi-riddle { font-size: 23px; line-height: 1.9; }
  .fi-box { display: flex; flex-direction: column; gap: 10px; background: var(--wall-raise); border: 1px solid var(--wall-line); border-radius: 14px; padding: 14px; }
  .fi-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font: 700 17px var(--f-ui); }
  .fi-h span { font: 600 13px var(--f-ui); color: var(--wall-muted); }
  details.fi-box summary { cursor: pointer; list-style-position: inside; }
  .fi-keys { display: flex; flex-direction: column; gap: 8px; }
  .fi-key { display: flex; align-items: flex-start; gap: 10px; text-align: start; border: 1.5px solid var(--wall-line); background: transparent; color: var(--wall-text); border-radius: 10px; padding: 10px 12px; font: 500 15px/1.6 var(--f-ui); }
  .fi-key i { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 6px; border: 2px solid var(--wall-muted); display: grid; place-items: center; font-style: normal; font-weight: 700; }
  .fi-key.on { border-color: #4E9A62; background: rgba(78, 154, 98, .14); }
  .fi-key.on i { background: #4E9A62; border-color: #4E9A62; color: #fff; }
  .fi-key.on i::after { content: "✓"; font-size: 14px; line-height: 1; }
  .fi-ans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .fi-a { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; border-radius: 12px; padding: 14px 4px 10px; font: 700 19px/1.2 var(--f-ui); color: #fff; }
  .fi-a b { font-size: 26px; font-variant-numeric: tabular-nums; }
  .fi-a.yes { background: #2E7A45; box-shadow: 0 3px 0 #1D5230; }
  .fi-a.no { background: var(--blood); box-shadow: 0 3px 0 #5E1C15; }
  .fi-a.irrelevant { background: #5C6670; box-shadow: 0 3px 0 #3C434A; font-size: 16px; }
  .fi-a:active { transform: translateY(2px); box-shadow: none; }
  .fr-last { display: flex; align-items: center; gap: 12px; border-radius: 14px; padding: 12px 14px; color: #fff; animation: frPop .35s ease-out; }
  .fr-last b { font: 700 26px/1.1 var(--f-ui); white-space: nowrap; }
  .fr-last span { font: 500 15px/1.5 var(--f-ui); }
  .fr-last.yes { background: #2E7A45; } .fr-last.no { background: var(--blood); } .fr-last.irrelevant { background: #5C6670; }
  @keyframes frPop { from { transform: scale(.92); opacity: .4; } to { transform: none; opacity: 1; } }
  .fr-hands { display: flex; flex-wrap: wrap; gap: 8px; }
