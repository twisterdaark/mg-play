  Object.assign(COURT_ACTS, MP_ACTS);

  // =====================================================================
  // ---------- CASES «كل واحد على موبايله»: the case game with every player on their own phone ----------
  // Same room as the court (host phone = authoritative state in MP.H with game 'cases').
  // Each phone only ever receives its own character sheet; sides show up only after a public reveal.
  const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const mcFits = (c, n) => !!c && c.minPlayers <= n && n <= c.maxPlayers;
  const mcCaseOf = () => (MP.H && MP.H.caseId ? caseView(MP.H.caseId, MP.H.scriptId) : null);
  const mcAlive = (H) => H.players.filter((p) => p.alive);
  // players who left mid-game keep their seat but don't hold the table up
  const mcPresent = (H) => mcAlive(H).filter((p) => !p.away);
  const mcWantNeed = (H) => Math.floor(Math.max(1, mcPresent(H).length) / 2) + 1;
  const mcBySeat = (H, seat) => H.players.find((q) => seatOf(q) === seat);
  const VOTE_GRACE = 1500; // the host keeps the ballot open a little after the deadline shown on the phones (polling delay)
  function mcNewHost(name) {
    return { game: 'cases', stage: 'lobby', no: 100 + rand(900), round: 0, players: [{ id: 'host', seat: 'h', name }], caseId: null, scriptId: null, night: 0, hints: [], recap: '',
      timer: { total: 0, left: 0, running: false, endAt: 0 }, vote: null, result: null, history: [], winner: null, endPub: null };
  }
  function mcResultPub(R) {
    const out = { counts: R.counts, skip: R.skip, alive: R.alive, need: R.need, ejected: R.ejected, rolling: !!R.rolling, revealed: !!R.revealed };
    if (R.revealed || R.ejected == null) out.outcome = R.outcome;
    if (R.revealed) { out.culprit = R.culprit; out.role = R.role; out.culLeft = R.culLeft; }
    return out;
  }
  function mcView(p) {
    const H = MP.H;
    const started = !['lobby', 'setup'].includes(H.stage);
    const c = started ? mcCaseOf() : null;
    const chOf = (q) => (c && q.charId ? c.characters.find((x) => x.id === q.charId) : null);
    const shownCul = c ? H.players.filter((q) => !q.alive && q.shown && chOf(q).side === 'culprit').length : 0;
    const pub = {
      game: 'cases', stage: H.stage, no: H.no, round: H.round, hostName: H.players[0].name,
      caseId: started ? H.caseId : null, rule: SET.rule, ghost: !!SET.ghost, recap: started ? H.recap : '',
      players: H.players.map((q) => {
        const o = { id: seatOf(q), name: q.name, charId: started ? q.charId : null, alive: started ? !!q.alive : true, ready: !!q.ready, want: !!q.want, away: !!q.away };
        if (c && !q.alive && q.shown) { const ch = chOf(q); o.out = { culprit: ch.side === 'culprit', role: ch.side === 'culprit' ? ch.culpritRole : '' }; }
        return o;
      }),
      night: H.night, total: H.hints.length,
      hints: ['night', 'vote', 'result', 'end'].includes(H.stage) ? H.hints.slice(0, H.night + 1) : [],
      culLeft: c ? c.culpritCount - shownCul : 0,
      wantNeed: mcWantNeed(H), present: mcPresent(H).length,
      timer: { left: hostTimerLeft(), running: H.timer.running, total: H.timer.total },
      vote: H.stage === 'vote' && H.vote ? { leftMs: Math.max(0, H.vote.endAt - Date.now()), total: H.vote.total, voters: H.vote.voters, done: Object.keys(H.vote.votes).length } : null,
      result: H.stage === 'result' && H.result ? mcResultPub(H.result) : null,
      end: H.stage === 'end' ? H.endPub : null,
    };
    const me = { id: seatOf(p), name: p.name };
    if (c && p.charId) {
      const ch = chOf(p);
      Object.assign(me, { ch, charId: p.charId, alive: !!p.alive, set: H.players.map((q) => q.charId) });
      me.partners = (ch.partners || []).map((id) => {
        const q = H.players.find((x) => x.charId === id);
        const pc = c.characters.find((x) => x.id === id);
        return q && pc ? { name: q.name, charName: pc.name, role: pc.culpritRole } : null;
      }).filter(Boolean);
      if (H.stage === 'vote' && H.vote) { const s = seatOf(p); me.canVote = H.vote.voters.includes(s); me.myVote = hasOwn(H.vote.votes, s) ? H.vote.votes[s] : null; }
    }
    return { t: 'state', pub, me };
  }

  // ---------- host: game flow ----------
  function mcStart() {
    const H = MP.H;
    const base = caseById(H.caseId);
    if (!mcFits(base, H.players.length)) return false;
    H.scriptId = pickScript(base);
    const c = caseView(base.id, H.scriptId);
    const ids = shuffle(inPlay(c, H.players.length));
    H.players.forEach((q, i) => Object.assign(q, { charId: ids[i], alive: true, ready: false, want: false, shown: false }));
    const set = new Set(ids);
    H.hints = c.nights.filter((h) => reqOK(h, set)).map((h) => h.text);
    H.recap = c.recap;
    H.night = 0; H.vote = null; H.result = null; H.history = []; H.winner = null; H.endPub = null;
    H.timer = { total: 0, left: 0, running: false, endAt: 0 };
    H.round++; H.no = 100 + rand(900);
    H.stage = 'intro';
    markPlayed(c.id, H.scriptId);
    keepAwake();
    return true;
  }
  function mcNight(k) {
    const H = MP.H;
    H.night = k; H.stage = 'night'; H.vote = null; H.result = null;
    H.players.forEach((q) => { q.want = false; q.ready = false; });
    const sec = SET.time > 0 ? SET.time : 0;
    H.timer = { total: sec, left: sec, running: sec > 0, endAt: Date.now() + sec * 1000 };
  }
  function mcStartVote() {
    const H = MP.H;
    const c = mcCaseOf();
    const last = H.night >= H.hints.length - 1;
    // ghost vote: innocents already voted out keep one vote on the last night
    const ghosts = last && SET.ghost ? H.players.filter((q) => !q.alive && q.shown && c.characters.find((x) => x.id === q.charId).side !== 'culprit') : [];
    const sec = clamp(Number(SET.voteSec) || 10, 3, 60);
    H.vote = { voters: mcAlive(H).concat(ghosts).map(seatOf), votes: {}, endAt: Date.now() + sec * 1000, total: sec };

    H.players.forEach((q) => { q.want = false; if (q.away && H.vote.voters.includes(seatOf(q))) H.vote.votes[seatOf(q)] = 'skip'; });

        <div class="who-list" aria-label="مين بيلعب مين">${pub.players.map((q) => `<span class="${q.alive ? '' : 'out'}"><b>${esc(q.name)}</b> = ${esc(chOf(q).name)}${q.away && q.alive ? ' · خرج من الأوضة' : ''}</span>`).join('')}</div>
        ${k < total - 1 && alive.length - 2 * pub.culLeft === 1 ? `<div class="lastnight">خلوا بالكم: لو طردتوا بريء كمان، ${multi ? 'الجناة يبقوا قدكم في العدد ويكسبوا' : 'الجاني يبقى قدكم في العدد ويكسب'}.</div>` : ''}
        ${k === total - 1 ? `<div class="lastnight">دي آخر ليلة. لو ${multi ? 'الجناة ما اتطردوش' : 'الجاني ما اتطردش'} الليلة دي، ${multi ? 'يبقوا هربوا' : 'يبقى هرب'}.</div>` : ''}
        ${ghosts.length ? `<div class="ghostnote">صوت الشبح: ${ghosts.map((q) => `<b>${esc(q.name)}</b>`).join('، ')} ${ghosts.length > 1 ? 'خرجوا وهما أبرياء، وليهم' : isF(chOf(ghosts[0])) ? 'خرجت وهي بريئة، وليها' : 'خرج وهو بريء، وليه'} صوت في تصويت الليلة دي.</div>` : ''}
        ${me.alive ? '' : '<div class="ghostnote">إنت خرجت من اللعب. تابع معاهم من غير ما تقول حاجة عن دورك.</div>'}
        ${evidenceHTML(pub.hints[k] || '', k)}
        ${prevH.length ? `<details class="prev" data-keep="prevh"><summary>الأدلة اللي فاتت (${prevH.length})</summary><ol>${prevH.map((h) => `<li>${tk(h)}</li>`).join('')}</ol></details>` : ''}
        ${pub.timer.total > 0 ? `
        <section class="timerbox" aria-label="وقت المناقشة">
          <div class="hd"><b>وقت المناقشة</b></div>
          <div class="timer" id="mp-timer" role="timer">${mmss(mpLeft())}</div>
          ${isHost ? `<div class="tctl"><button data-act="mcTimer" data-arg="toggle">${pub.timer.running ? 'وقّف' : 'كمّل'}</button><button data-act="mcTimer" data-arg="add">+30 ث</button></div>` : ''}
        </section>` : ''}
        <section class="setgroup">
          ${me.alive ? `<button id="mc-want" class="btn ${mine.want ? 'ghost' : 'primary'}" data-act="mcWant" data-arg="${mine.want ? 0 : 1}">${mine.want ? WANT_ON : WANT_OFF}</button>` : ''}
          <div class="status"><span>عايزين يصوّتوا: <b id="mc-wantn">${wantN}</b> من ${pub.present}</span><span>التصويت بيبدأ عند <b id="mc-needn">${pub.wantNeed}</b></span></div>
        </section>
        ${roleSec()}
        <details class="prev" data-keep="cast"><summary>المشتبه فيهم</summary>${mcCastHTML(pub, cv)}</details>
        <details class="prev" data-keep="qs"><summary>مش عارفين تسألوا إيه؟</summary><ul class="qs">${[0, 1, 2].map((j) => `<li>${QUESTIONS[(k * 3 + j) % QUESTIONS.length]}</li>`).join('')}</ul></details>
      </div>`;
    }

    if (pub.stage === 'vote') {
      const V = pub.vote || { voters: [], done: 0 };
      const myVote = me.myVote != null ? me.myVote : MP.myVoteKey === MP.vKey ? MP.myVote : null;
      let body;
      if (me.canVote && myVote == null) {
        body = `
          <p class="eyebrow">${me.alive ? 'التصويت سري' : 'صوت الشبح'}</p>
          <h1 class="h2">بتشك في مين؟</h1>
          <div class="mc-count" role="timer"><span id="mc-vote">${mcVoteLeft()}</span></div>
          <div class="choices">
            ${alive.filter((q) => q.id !== me.id).map((q) => `<button class="choice" data-act="mcVote" data-arg="${esc(q.id)}"><span class="pn">${esc(q.name)}</span><span class="cn">${esc(chOf(q).name)}</span></button>`).join('')}
            <button class="choice skip" data-act="mcVote" data-arg="skip"><span class="pn">سكيب</span><span class="cn">مش متأكد لسه</span></button>
          </div>
          <p class="lede small">اختيارك نهائي. لو الوقت خلص من غير ما تختار، صوتك بيتحسب سكيب.</p>`;
      } else if (me.canVote) {
        body = `
          <div class="handoff">
            <p class="to">صوتك اتسجل</p>
            <div class="who">${myVote === 'skip' ? 'سكيب' : esc(nameOf(myVote))}</div>
            <p class="note">مستنيين الباقيين (${V.done} من ${V.voters.length})</p>
            <div class="mc-count sm"><span id="mc-vote">${mcVoteLeft()}</span></div>
          </div>`;
      } else {
        body = `
          <div class="handoff">
            <p class="to">التصويت شغال</p>
            <p class="note">إنت برا اللعب، استنى النتيجة (${V.done} من ${V.voters.length} صوّتوا).</p>
            <div class="mc-count sm"><span id="mc-vote">${mcVoteLeft()}</span></div>
          </div>`;
      }
      return `<div class="screen">${header}${body}</div>`;
    }

    if (pub.stage === 'result' && pub.result) {
      const R = pub.result;
      const needPct = (R.need / R.alive) * 100;
      const bar = (n, cls) => `<div class="bar"><i class="${cls || ''}" style="width:${(n / R.alive) * 100}%"></i><span class="need" style="inset-inline-start:${needPct}%"></span></div>`;
      const tally = `
        <div class="tally">
          ${R.counts.map(([id, n]) => `<div class="bar-row"><span class="nm">${esc(nameOf(id))}</span>${bar(n)}<span class="ct">${n}</span></div>`).join('')}
          ${R.skip ? `<div class="bar-row"><span class="nm">سكيب</span>${bar(R.skip, 'skipbar')}<span class="ct">${R.skip}</span></div>` : ''}
          <div class="legend">${pub.rule === 'plurality' ? 'اللي عليه أكتر أصوات بيطلع، لو مفيش تعادل وأصواته أكتر من السكيب.' : `<i></i> الخط ده هو الأغلبية: ${R.need} من ${R.alive} أصوات`}</div>
        </div>`;
      let body = '';
      const ej = R.ejected != null ? pub.players.find((q) => q.id === R.ejected) : null;
      if (!ej) body = '<p class="lede">محدش خد أصوات كفاية، فمحدش طلع الليلة دي.</p>';
      else {
        const ch = chOf(ej);
        const nm = esc(ej.name);
        body = !R.revealed ? `
          <article class="paper verdict ${R.rolling ? 'rolling' : ''}">
            <p class="as">التصويت طرد</p>
            <div class="who">${nm}</div>
            <p class="as">${isF(ch) ? 'بتلعب' : 'بيلعب'} ${esc(ch.name)}</p>
          </article>` : `
          <article class="paper verdict">
            <div class="who">${nm}</div>
            <span class="stamp big thud ${R.culprit ? 'blood' : ''}">${R.culprit ? esc(R.role) : innocentWord(ch)}</span>
            <p class="as">${R.culprit ? `${isF(ch) ? 'طلعت' : 'طلع'} من الجناة! ${isF(ch) ? 'كانت بتلعب' : 'كان بيلعب'} ${esc(ch.name)}.` : `${isF(ch) ? 'كانت بتلعب' : 'كان بيلعب'} ${esc(ch.name)}، ${isF(ch) ? 'وكانت بريئة' : 'وكان بريء'}.`}</p>
            ${R.culprit && R.culLeft > 0 ? `<p class="as"><b>لسه فيه ${R.culLeft === 1 ? 'جاني واحد' : R.culLeft + ' جناة'} بينكم.</b></p>` : ''}
            ${!R.outcome ? `<p class="as">يا ${nm}، ${isF(ch) ? 'قولي كلمتك الأخيرة في جملة واحدة. ممكن تساعدي' : 'قول كلمتك الأخيرة في جملة واحدة. ممكن تساعد'} ${R.culprit ? 'شريكك' : 'المحققين'}.</p>` : ''}
          </article>`;
      }
      const canGo = !ej || R.revealed;
      const hostBtns = canGo ? `<button class="btn primary" data-act="mcNext">${R.outcome ? 'شوفوا النهاية' : `على الليلة ${pub.night + 2}`}</button>`
        : `<button class="btn danger" data-act="mcReveal" ${R.rolling ? 'disabled' : ''}>${R.rolling ? 'لحظة…' : 'اكشف: بريء ولا جاني؟'}</button>`;
      return `
      <div class="screen">
        ${header}
        <h1 class="h2">الأصوات · الليلة ${pub.night + 1}</h1>
        ${tally}
        ${body}
        <div class="actionbar">${isHost ? hostBtns : `<p class="lede small" style="text-align:center">${canGo ? 'المضيف هيكمّل.' : 'المضيف هيكشف دلوقتي…'}</p>`}</div>
      </div>`;
    }

    if (pub.stage === 'end' && pub.end) {
      const E = pub.end;
      const multi = E.culpritCount > 1;
      const w = E.winner;
      const stamp = w === 'innocents' ? 'اتقفلت القضية' : w === 'culprits' ? 'قُيّدت ضد مجهول' : 'اتقفلت من غير حكم';
      const head = w === 'innocents' ? (multi ? 'الجناة اتمسكوا' : 'الجاني اتمسك') : w === 'culprits' ? (multi ? 'الجناة هربوا' : 'الجاني هرب') : 'الحقيقة كاملة';
      const sub = w === 'innocents' ? 'الأبرياء كسبوا. برافو يا محققين.' : w === 'culprits' ? (multi ? 'الجناة كسبوا. كدبوا عليكم كلكم.' : 'الجاني كسب. كدب عليكم كلكم.') : 'اللعبة اتقفلت قبل ما تخلص.';
      const cards = Object.entries(E.awards || {}).filter(([k]) => AWARDS[k]).map(([k, n]) => `<div class="award"><span class="at">${AWARDS[k].t}</span><span class="an">${esc(n)}</span><span class="ad">${AWARDS[k].d}</span></div>`).join('');
      return `
      <div class="screen">
        ${header}
        <article class="paper"><div class="end-head">
          <span class="stamp big thud ${w === 'culprits' ? 'blood' : ''}">${stamp}</span>
          <h1 class="h-display">${head}</h1>
          <p style="font-family:var(--f-ui);color:var(--ink-soft)">${sub}</p>
        </div></article>
        ${w === 'innocents' || w === 'culprits' ? `<section class="setgroup"><h2 style="font:700 18px var(--f-ui)">ألقاب القضية دي</h2>${cards ? `<div class="awards">${cards}</div>` : '<p class="lede small">مفيش ألقاب المرة دي.</p>'}</section>` : ''}
        <article class="paper"><div class="report-head"><span>اللي حصل فعلًا</span><b>${esc(base.title)}</b></div>${paras(E.solution)}</article>
        <article class="paper truth">
          <div class="report-head"><span>ملف الحقيقة</span><b>الخط الزمني والأدلة</b></div>
          ${E.culprits.map((x) => `<h3>${esc(x.charName)} (${esc(x.name)}) بالساعة</h3>
            <ol class="times">${x.timeline.map((t) => `<li><time>${esc(t.time)}</time><span>${tk(t.text)}</span></li>`).join('')}</ol>
            <h3>القصة اللي ${x.f ? 'قالتها' : 'قالها'}</h3>${paras(x.cover)}`).join('')}
          <h3>الأدلة</h3>
          <ol>${E.hints.map((h, j) => `<li>${tk(h)} ${j < E.opened ? `<span class="small" style="color:var(--ink-soft);font-family:var(--f-ui)">(الليلة ${j + 1})</span>` : '<span class="miss">دليل فاتكم</span>'}</li>`).join('')}</ol>
        </article>
        <article class="paper">
          <div class="report-head"><span>مين كان مين</span><b>${E.who.length} لاعبين</b></div>
          <ol class="cast">${E.who.map((x) => `<li><div class="pn">${esc(x.name)}</div><div class="cn">${esc(x.charName)} <span>· ${esc(x.job)}</span></div>
            <span class="stamp sm ${x.culprit ? 'blood' : ''}">${x.culprit ? esc(x.role) : x.f ? 'بريئة' : 'بريء'}</span></li>`).join('')}</ol>
        </article>
        <div class="actionbar">
          ${isHost ? '<button class="btn primary" data-act="mcAgain">قضية تانية بنفس الناس</button><button class="btn ghost" data-act="mpClose">اقفل الأوضة</button>'
            : '<p class="lede small" style="text-align:center">المضيف هيختار القضية الجاية.</p><button class="btn ghost" data-act="mpLeave">اخرج من الأوضة</button>'}
        </div>
      </div>`;
    }
    return screens.mpWait();
  };

  const MC_ACTS = {
    openMc() { MP.err = ''; MP.game = 'cases'; S = { screen: 'mcHome', mode: 'mc' }; render(); },
    mcCreate() { MP.err = ''; MP.game = 'cases'; S = { screen: 'mpCreate', mode: 'mc' }; render(); },
    mcJoin() { MP.err = ''; MP.finding = ''; MP.findTry++; MP.game = 'cases'; S = { screen: 'mpJoin', mode: 'mc' }; render(); },
    mcToSetup() { const H = MP.H; if (!H || H.stage !== 'lobby' || H.players.length < 3) return; H.stage = 'setup'; hostBroadcast(); },
    mcBackLobby() { const H = MP.H; if (!H || H.stage !== 'setup') return; H.stage = 'lobby'; H.caseId = null; hostBroadcast(); },
    mcPick(id) { if (!MP.H) return; if (!id) { MP.H.caseId = null; hostBroadcast(); return; } SND.play('pick'); mpSend('pick', id); },
    mcRandom() {
      const H = MP.H;
      if (!H) return;
      const pool = CASES.filter((c) => mcFits(c, H.players.length));
      if (!pool.length) return;
      const fresh = pool.filter((c) => (c.scripts || []).some((s) => !playedOf(c.id).includes(s.id)));
      const list = fresh.length ? fresh : pool;
      SND.play('reveal');
      mpSend('pick', list[rand(list.length)].id);
    },
    mcStart() { mpSend('start'); },
    mcReady(v) { mpSend('ready', v === '1'); },
    mcNights() {
      const pub = MP.V && MP.V.pub;
      if (pub && !pub.players.every((q) => q.ready)) {
        modal = { title: 'لسه فيه ناس مش جاهزين', body: 'فيه حد لسه بيقرا دوره. تبدأوا الليلة الأولى برضه؟', actions: [{ label: 'ابدأوا برضه', act: 'mcNightsGo', cls: 'primary' }, { label: 'نستنى شوية', act: 'closeModal' }] };
        render();
        return;
      }
      mpSend('nights');
    },
    mcNightsGo() { modal = null; mpSend('nights'); },
    mcWant(v) { mpSend('want', v === '1'); },
    mcVote(id) {
      if (!mcVoteLeft()) return; // the ballot closes on the phone when its countdown hits zero
      SND.play('vote'); buzz(30);
      MP.myVote = id; MP.myVoteKey = MP.vKey; // show «صوتك اتسجل» right away, before the host's update comes back
      mpSend('vote', id);
      render();
    },
    mcAskForce() {
      modal = { title: 'تبدأوا التصويت دلوقتي؟', body: 'التصويت هيبدأ على كل الموبايلات حتى لو الأغلبية لسه ما طلبتوش. استعملوه لو حد خرج أو موبايله فصل.', actions: [{ label: 'أيوه، ابدأوا التصويت', act: 'mcForceVote', cls: 'primary' }, { label: 'لأ', act: 'closeModal' }] };
      render();
    },
    mcForceVote() { modal = null; mpSend('forceVote'); },
    mcReveal() { mpSend('reveal'); },
    mcNext() { mpSend('next'); },
    mcTimer(cmd) { mpSend('timer', cmd); },
    mcShowRole() { S.show = true; TIMES = false; render(); },
    mcHideRole() { S.show = false; TIMES = false; render(); window.scrollTo(0, 0); },
    mcAskEnd() {
      modal = { title: 'متأكدين؟', body: 'هتتكشف الحقيقة كلها على كل الموبايلات، ومش هينفع تكمّلوا القضية دي.', actions: [{ label: 'أيوه، اكشفوا كل حاجة', act: 'mcEndNow', cls: 'danger' }, { label: 'لأ، رجوع', act: 'closeModal' }] };
      render();
    },
    mcEndNow() { modal = null; mpSend('abandon'); },
    mcAgain() { mpSend('again'); },
  };
  Object.assign(COURT_ACTS, MC_ACTS);

  // ---------- «بصمات»: the game's coin. A daily gift (a 7-day streak) and rewarded ads; no use yet ----------
  // stored in localStorage; bad or edited data falls back to safe values instead of breaking the app
  const WALLET_KEY = 'qadaya.wallet.v1';
  const GIFT_DAYS = [10, 15, 20, 25, 30, 40, 60]; // day 1..7; after day 7 a new week starts from day 1
  const AD_REWARD = 20, AD_CAP = 5; // «+»: coins per ad, ads per day
  const pad2 = (n) => String(n).padStart(2, '0');
  const dayKey = (d) => { d = d || new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }; // the phone's local date
  const prevDayKey = (k) => { const [y, m, d] = k.split('-').map(Number); return dayKey(new Date(y, m - 1, d - 1)); };
  const isDayKey = (v) => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
  const intIn = (v, lo, hi, dflt) => { const n = Math.floor(Number(v)); return Number.isFinite(n) && n >= lo && n <= hi ? n : dflt; };
  function walletLoad() {
    const o = store.get(WALLET_KEY);
    const w = (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
    const W = {
      bal: intIn(w.bal, 0, 1e7, 0), day: intIn(w.day, 0, 7, 0), last: isDayKey(w.last) ? w.last : '',
      doubled: isDayKey(w.doubled) ? w.doubled : '', adDay: isDayKey(w.adDay) ? w.adDay : '', ads: intIn(w.ads, 0, 99, 0),
    };
    const t = dayKey();
    if (W.last > t) W.last = t; // the phone's clock went back: today's gift counts as taken
    if (W.adDay > t) { W.adDay = t; W.ads = AD_CAP; }
    return W;
  }
  let WAL = walletLoad();
  let walletBump = false, giftAsked = false;
  const walletSave = () => store.set(WALLET_KEY, WAL);
  const addCoins = (n) => { WAL.bal = Math.min(1e7, WAL.bal + n); walletSave(); walletBump = true; };
  // a joining phone's room page (another origin, its own storage) has no wallet; the dev relay on this computer does
  const walletHere = () => !servedByRoom() || /^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname);
  const giftReady = () => WAL.last !== dayKey();
  // today's step of the streak: the one after yesterday's, else day 1 (a missed day starts over)
  const giftDay = () => {
    const t = dayKey();
    if (WAL.last === t) return WAL.day || 1;
    return (WAL.last && WAL.last === prevDayKey(t) && WAL.day >= 1 && WAL.day < 7) ? WAL.day + 1 : 1;
  };
  const adsLeft = () => Math.max(0, AD_CAP - (WAL.adDay === dayKey() ? WAL.ads : 0));
  const coins = (n) => (n === 1 ? 'بصمة واحدة' : n === 2 ? 'بصمتين' : `${n} ${n >= 3 && n <= 10 ? 'بصمات' : 'بصمة'}`);
  const COIN_SVG = `<svg class="coin-ic" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="14.5" fill="#EFC26A" stroke="#B98A34" stroke-width="2"/><circle cx="16" cy="16" r="11.2" fill="none" stroke="#B98A34" stroke-width="1" opacity=".7"/><g fill="none" stroke="#5F3D8C" stroke-width="1.6" stroke-linecap="round"><path d="M10.3 13.2a6.3 6.3 0 0 1 11.4 0"/><path d="M9.8 18.6c-.4-1-.6-2.1-.6-3.2a6.8 6.8 0 0 1 .3-2"/><path d="M12.4 21.4c-.6-1.6-.9-3.4-.9-5.3a4.5 4.5 0 0 1 9 0c0 1.3-.1 2.5-.4 3.7"/><path d="M15.1 22.8c-.5-1.9-.8-3.9-.8-6a1.7 1.7 0 0 1 3.4 0c0 2-.2 3.9-.8 5.6"/><path d="M22.6 16.1c0 1.6-.2 3.1-.6 4.6"/></g></svg>`;
  function walletChip() {
    if (!walletHere()) return '';
    const bump = walletBump; walletBump = false;
    return `<div class="wallet">
      <button class="wallet-chip${bump ? ' bump' : ''}" data-act="walletOpen" aria-label="معاك ${coins(WAL.bal)}${giftReady() ? '، وهدية النهارده مستنياك' : ''}">${COIN_SVG}<b>${WAL.bal}</b>${giftReady() ? '<i class="dot" aria-hidden="true"></i>' : ''}</button>
      <button class="wallet-plus" data-act="walletAdd" aria-label="زوّد بصماتك بإعلان">+</button>
    </div>`;
  }
  // the week's calendar; 'claimed' marks today's tile as taken
  function giftCal(today, claimed) {
    return `<div class="gift-cal">${GIFT_DAYS.map((n, i) => {
      const d = i + 1;
      const cls = (d < today || (d === today && claimed)) ? 'done' : d === today ? 'today' : '';
      return `<div class="gift-d${d === 7 ? ' big' : ''}${cls ? ' ' + cls : ''}"><span>${d === today ? 'النهارده' : `يوم ${d}`}</span>${COIN_SVG}<b>${n}</b></div>`;
    }).join('')}</div>`;
  }
  // first visit to the main screen today (after the opening titles): open the gift by itself
  // after an update, the «الجديد» card comes first (once per version), then the daily gift
  function maybeNews() {
    if (S.screen !== 'modes' || modal || splashOn() || servedByRoom() || !CHANGELOG.length) return false;
    const cur = CHANGELOG[0].v, seen = store.get(NEWS_KEY);
    if (seen === cur) return false;
    let played = false; // a fresh install has nothing to catch up on: only players who had an older version see it
    try { played = Object.keys(localStorage).some((k) => /^qadaya\.(stats|court|played|wallet|game|names|fi|settings)/.test(k)); } catch (e) { /* no storage */ }
    if (!played) { store.set(NEWS_KEY, cur); return false; }
    const e = CHANGELOG[0];

  // ---------- opening titles (the #splash markup sits before this script) ----------

  // ---------- render ----------
  const SECRET_SCREENS = new Set(['role', 'reviewShow', 'vote', 'cRole', 'fiGM']);

  // ---------- scratch card ----------
  function setupScratch() {
    const wrap = document.getElementById('scratch');
    const cv = wrap && wrap.querySelector('canvas');
    if (!cv) return;
    const box = wrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(box.width * dpr);
    cv.height = Math.round(box.height * dpr);
    const c2 = cv.getContext('2d');
    if (!c2) { S.revealed = true; render(); return; }
    c2.scale(dpr, dpr);
    const W = box.width, H = box.height;
    const grad = c2.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, getVar('--foil-a')); grad.addColorStop(.5, getVar('--foil-b')); grad.addColorStop(1, getVar('--foil-a'));
    c2.fillStyle = grad; c2.fillRect(0, 0, W, H);
    c2.strokeStyle = 'rgba(255,255,255,.2)'; c2.lineWidth = 1;
    for (let x = -H; x < W; x += 7) { c2.beginPath(); c2.moveTo(x, 0); c2.lineTo(x + H, H); c2.stroke(); }
    c2.direction = 'rtl'; c2.textAlign = 'center'; c2.textBaseline = 'middle';
    c2.fillStyle = 'rgba(38,42,50,.28)'; c2.font = '600 13px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    for (let y = 18, r = 0; y < H; y += 30, r++) for (let x = (r % 2 ? 40 : 90); x < W + 60; x += 110) c2.fillText('خربش هنا', x, y);
    c2.fillStyle = 'rgba(30,33,40,.8)'; c2.font = '700 22px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    c2.fillText('خربش بصباعك', W / 2, H / 2);
    wrap.classList.add('ready');

    c2.globalCompositeOperation = 'destination-out';
    c2.strokeStyle = '#000'; c2.fillStyle = '#000';
    c2.lineCap = 'round'; c2.lineJoin = 'round'; c2.lineWidth = 46;
    let last = null, done = false, lastSnd = 0;
    let box0 = cv.getBoundingClientRect(); // re-read once per stroke, not on every move
    const pos = (e) => [e.clientX - box0.left, e.clientY - box0.top];
    // coverage is tracked on a coarse grid in JS (no getImageData: reading pixels back from the GPU stalls phones)
    const COLS = 14, ROWS = 7, cells = new Uint8Array(COLS * ROWS);
    let covered = 0;
    const mark = (x, y) => {
      for (const [ox, oy] of [[0, 0], [16, 0], [-16, 0], [0, 16], [0, -16]]) {
        const cx = Math.floor(((x + ox) / W) * COLS), cy = Math.floor(((y + oy) / H) * ROWS);
        if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) continue;
        const k = cy * COLS + cx;
        if (!cells[k]) { cells[k] = 1; covered++; }
      }
    };
    const markLine = (a, b) => {
      const steps = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 10));
      for (let i = 0; i <= steps; i++) mark(a[0] + ((b[0] - a[0]) * i) / steps, a[1] + ((b[1] - a[1]) * i) / steps);
    };
    const check = () => { if (!done && covered / cells.length > 0.55) finish(); };
    const finish = () => {
      done = true; buzz(35); SND.play('reveal');
      wrap.classList.add('done');
      setTimeout(() => { scratching = false; S.revealed = true; render(); }, 450);
    };
    cv.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      scratching = true;
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      box0 = cv.getBoundingClientRect();
      last = pos(e);
      c2.beginPath(); c2.arc(last[0], last[1], 23, 0, Math.PI * 2); c2.fill();
      mark(last[0], last[1]);
    });
    cv.addEventListener('pointermove', (e) => {
      if (!last || done) return;
      const p = pos(e);
      c2.beginPath(); c2.moveTo(last[0], last[1]); c2.lineTo(p[0], p[1]); c2.stroke();
      markLine(last, p);
      const now = performance.now();
      if (now - lastSnd > 70 && Math.hypot(p[0] - last[0], p[1] - last[1]) > 2) { lastSnd = now; SND.play('scratch'); }
      last = p;
      check();
    });
    const up = () => { last = null; check(); };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
  }
  // true from the first stroke on a card until it's revealed: the multi-phone screen then patches counters instead of redrawing
  let scratching = false;

  // ---------- timer ----------

  // ---------- game logic ----------
  function tally() {
    const g = ctx();
    const counts = {};
    let skip = 0;
    Object.values(S.votes).forEach((v) => { if (v < 0) skip++; else counts[v] = (counts[v] || 0) + 1; });
    const alive = S.voteQ.length;
    const plurality = SET.rule === 'plurality';
    const top = Math.max(0, ...Object.values(counts));
    const tops = Object.keys(counts).filter((i) => counts[i] === top);
    // majority: more than half of the living players; plurality: the most votes, no tie, and more than the skips
    const need = plurality ? Math.max(top, 1) : Math.floor(alive / 2) + 1;
    let ejected = null;
    if (plurality) { if (top > 0 && tops.length === 1 && top > skip) ejected = +tops[0]; }
    else Object.entries(counts).forEach(([i, n]) => { if (n >= need) ejected = +i; });
    if (ejected != null) S.players[ejected].alive = false;
    const now = aliveIdx();
    const culLeft = now.filter((i) => g.chOf(i).side === 'culprit').length;
    const innLeft = now.length - culLeft;
    let outcome = null;
    if (culLeft === 0) outcome = 'innocents';
    else if (culLeft >= innLeft) outcome = 'culprits';
    else if (S.night >= g.hints.length - 1) outcome = 'culprits';
    S.result = { counts, skip, alive, need, ejected, revealed: false, outcome, culLeft };
    S.history = (S.history || []).concat([{ night: S.night, votes: Object.assign({}, S.votes), ejected }]);
    S.screen = 'result';
  }

  function startGame(names) {

      voteQ: [], voteIdx: 0, votes: {}, choice: null, result: null, winner: null, reviewIdx: 0,

  const act = {

      if (empty >= 0) { err.textContent = `اكتب اسم اللاعب ${empty + 1}.`; document.getElementById(`name-${empty}`).focus(); return; }
      const seen = new Set();

    startNights() { S.night = 0; S.hintOpen = false; resetTimer(SET.time); SND.play(isHorror(ctx().c) ? 'nightHorror' : 'night'); go('night'); },
    openHint() { S.hintOpen = true; buzz(20); SND.play('hint'); render(); },

    toVote() {

    revealResult() {

      setTimeout(() => {

    lockedMode() {

    randomCase(scope) {
      let pool;
      if (scope === 'cat') { const cat = CATEGORIES.find((x) => x.id === S.cat) || CATEGORIES[0]; pool = cat.cases.map(caseById).filter(Boolean); }
      else if (scope === 'all') pool = filteredCases();
      else pool = CASES.slice();
      if (!pool || !pool.length) return;
      // prefer cases that still have unplayed scripts
      const fresh = pool.filter((c) => (c.scripts || []).some((s) => !playedOf(c.id).includes(s.id)));
      const list = fresh.length ? fresh : pool;
      const c = list[rand(list.length)];
      S.randomFrom = scope;
      SND.play('reveal');

        title: 'القضية اللي اختارتلكم',
        html: `<div class="cover-card" style="pointer-events:none"><span class="art">${art(c.id)}</span><span class="range">${rangeLabel(c)}</span><span class="ct">${esc(c.title)}</span><span class="cm">${esc(c.tagline)}</span></div>`,
        actions: [{ label: 'يلا نلعبها', act: 'pickFromModal', arg: c.id, cls: 'primary' }, { label: 'اختار تاني', act: 'randomCase', arg: scope }, { label: 'رجوع', act: 'closeModal' }],

    pickFromModal(id) {
      modal = null;

    },
    openSuggest() { S = { screen: 'suggest', sugg: (S && S.sugg && !S.sugg.sent) ? S.sugg : { type: 'جناية' } }; render(); },
    newSuggestion() { S = { screen: 'suggest', sugg: { type: 'جناية' } }; render(); },
    async sendSuggestion() {
      const st = suggestState();
      if (!st.ok || S.sugg.sending) return;
      S.sugg.sending = true;
      const d = S.sugg;
      const item = { title: st.t, desc: st.x, type: d.type || '', players: (d.players || '').trim(), name: (d.name || '').trim(), at: new Date().toISOString(), sent: false };
      const box = store.get(OUTBOX_KEY) || [];
      box.push(item); store.set(OUTBOX_KEY, box);
      let note;
      if (SUGGEST_CFG.googleForm) {
        try { await postSuggestion(item); item.sent = true; store.set(OUTBOX_KEY, box); note = 'اقتراحك وصلنا. لو تم اختياره، هيظهر كقضية في تحديث جاي.'; }
        catch (e) { note = 'مفيش نت دلوقتي. اقتراحك محفوظ، وهيتبعت لوحده أول ما النت يرجع.'; }
      } else if (SUGGEST_CFG.github) {
        openUrl(`https://github.com/${SUGGEST_CFG.github}/issues/new?labels=suggestion&title=${encodeURIComponent(item.title)}&body=${encodeURIComponent(suggestionText(item))}`);
        item.sent = true; store.set(OUTBOX_KEY, box);
        note = 'فتحنالك صفحة الاقتراح على GitHub. دوس «Submit» هناك عشان يوصل.';
      } else {
        const shared = shareText(suggestionText(item));
        note = shared ? 'اختار التطبيق اللي هتبعت بيه الاقتراح (واتساب أو إيميل)، وهو محفوظ على الموبايل كمان.' : 'اقتراحك محفوظ على الموبايل ده.';
      }
      SND.play('stamp');
      S.sugg = Object.assign({}, d, { sent: true, sentNote: note });
      render();
    },
    quickName(n) {
      const i = Array.from({ length: S.n }, (_, j) => j).find((j) => !(S.names[j] || '').trim());

    setColor(c) {

      store.set(PROFILES_KEY, all); render();

    giveRose(i) {

      buzz(30); SND.play('win');
      render();
    },
    async shareResult() {
      let url;
      try { url = await makeResultCard(); } catch (e) { return; }
      const text = `لعبنا «${ctx().c.title}» في لعبة «${GAME_NAME}». جربوها وشوفوا مين فيكم الجاني!`;
      try { if (NATIVE && NATIVE.shareImage) { NATIVE.shareImage(url.split(',')[1], text); return; } } catch (e) { /* fall through */ }
      try {
        const blob = await (await fetch(url)).blob();
        const file = new File([blob], 'qadaya-result.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
      } catch (e) { /* fall through */ }
      modal = { title: 'كارت النتيجة', body: 'دوس مطوّلًا على الصورة واحفظها أو ابعتها.', html: `<img class="shot" src="${url}" alt="كارت النتيجة">`, actions: [{ label: 'تمام', act: 'closeModal', cls: 'primary' }] };

    setScale(v) { SET.scale = Number(v) || 1; store.set(SET_KEY, SET); applyScale(); render(); },

    askResetPlayed() {
      modal = { title: 'نبدأ السيناريوهات من الأول؟', body: 'اللعبة هتنسى السيناريوهات اللي لعبتوها، وممكن يطلعلكم سيناريو لعبتوه قبل كده.', actions: [{ label: 'أيوه، ابدأ من الأول', act: 'resetPlayed', cls: 'danger' }, { label: 'لأ', act: 'closeModal' }] };

    resetPlayed() { store.del(PLAYED_KEY); modal = null; render(); },
    // the cases board and the court board can be cleared on their own or together
    askResetBoard() {

      const actions = [];

    reviewStart() { go('reviewPick'); },
    reviewWho(i) { S.reviewIdx = Number(i); TIMES = false; go('reviewPass'); },
    menu() {

        actions: [{ label: 'أيوه، اكشفوا كل حاجة', act: 'endNow', cls: 'danger' }, { label: 'لأ، رجوع', act: 'closeModal', cls: 'ghost' }],

    newsOk() { store.set(NEWS_KEY, CHANGELOG[0].v); modal = null; render(); maybeGift(); },

    modalRules() { modal = null; stopTimer(); store.set(SAVE_KEY, S); S = { screen: 'rules' }; render(); },
    closeModal() { modal = null; render(); },
    resume() {
      const s = store.get(SAVE_KEY);
      if (!(s && s.players && caseById(s.caseId))) return;
      // never reopen straight onto someone's secret screen
      if (s.screen === 'role') { s.screen = 'pass'; s.revealed = false; }
      else if (s.screen === 'reviewShow' || s.screen === 'reviewPass') s.screen = 'night';
      else if (s.screen === 'vote') { s.screen = 'votePass'; s.choice = null; }
      if (s.result && s.result.rolling) s.result.rolling = false;

  // sound when a screen opens (night/result/end play their own from the action that opens them)
  const ENTER_SND = {
    pass: 'handoff', votePass: 'handoff', reviewPass: 'handoff', intro: 'file', cast: 'suspense',
    count: 'page', names: 'page', recap: 'page', rules: 'page', castView: 'page', reviewPick: 'page', reviewShow: 'page', role: 'page', vote: 'page',
    home: 'page', cat: 'page', all: 'page', suggest: 'page', settings: 'page', board: 'page', profile: 'page',
    cSetup: 'page', cCase: 'file', cPass: 'handoff', cRole: 'page', cVerdict: 'suspense', cLib: 'page',
    mpHome: 'page', mpCreate: 'page', mpJoin: 'page', mpLobby: 'page', mpCase: 'file', mpWait: 'page',
    mcHome: 'page', mcLobby: 'page', mcSetup: 'file', olCreate: 'page', olBrowse: 'page', olJoin: 'page',

  const OWN_SOUND = new Set(['startNights', 'openHint', 'castVote', 'revealResult', 'next', 'reveal', 'mode', 'soundToggle', 'endNow', 'randomCase', 'giveRose', 'sendSuggestion', 'quickName',
    'cObjection', 'cEvidence', 'cRule', 'cSetVerdict', 'cSetSentence', 'cAnnounce', 'cToggleMission', 'cReroll', 'cNext', 'cHide', 'cPublishNews', 'cTwist', 'cSaveLib',
    'mpEvReq', 'mpObjection', 'mpAnnounce', 'mpReroll', 'mpSaveLib', 'mcVote', 'mcPick', 'mcRandom',
    'fiRandom', 'fiHint', 'fiAns', 'fiSolve', 'fiGiveUpGo', 'giftClaim']);
  Object.assign(act, COURT_ACTS, FI_ACTS, SOLO_ACTS, WALLET_ACTS, VC_ACTS);

  // Android Back button (called from the APK wrapper). Returns true when handled.
  const BACK = {
    home: 'modes', rules: 'modes', settings: 'modes', board: 'modes', profile: 'board', cat: 'home', all: 'home', suggest: 'home',
    intro: 'count', names: 'intro', castView: 'night', reviewPick: 'night', reviewPass: 'night', reviewShow: 'night',
    cSetup: 'modes',
    fiHome: 'modes', fiRiddle: 'fiHome', fiGM: 'fiRiddle', fiEnd: 'fiHome',
  };
  window.__back = () => {
    if (splashOn()) { splashEnd(); return true; }
    if (adBusy) return true; // an ad is playing
    if (modal) { act.closeModal(); return true; }
    if (S.screen === 'modes') return false;
    if (S.screen === 'count') { go(S.back || (S.cat ? 'cat' : 'home')); return true; }
    if (BACK[S.screen]) { go(BACK[S.screen]); return true; }
    if (S.screen === 'end') { act.newCase(); return true; }
    if (S.screen === 'cLib') { go('cCase'); return true; }
    // the join screen of a room page opened inside the app: Back returns to the app itself
    if (S.screen === 'mpJoin' && !MP.role && servedByRoom() && NATIVE && NATIVE.goHome) { act.mpLeave(); return true; }
    if (S.mode === 'mc') {
      if (S.screen === 'mcHome') go('home');
      else if (S.screen === 'olJoin' && !MP.role && MP.olj.room) go('olBrowse');
      else if (!MP.role) { MP.game = 'cases'; S = { screen: 'mcHome', mode: 'mc' }; render(); }
      else act.mpMenu();
      return true;
    }
    if (S.mode === 'mp') {
      if (S.screen === 'mpHome') act.openCourt();
      else if (S.screen === 'mpCreate' || ((S.screen === 'mpJoin' || S.screen === 'olCreate' || S.screen === 'olBrowse') && !MP.role)) go('mpHome');
      else if (S.screen === 'olJoin' && !MP.role) go(MP.olj.room ? 'olBrowse' : 'mpHome');
      else act.mpMenu();
      return true;
    }
    if (S.mode === 'court') { act.cMenu(); return true; }
    act.menu();
    return true;
  };

  app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (performance.now() - lastNav < 400) return;
    if (el.dataset.self && e.target !== el) return; // modal backdrop only
    const f = act[el.dataset.act];
    if (f) {
      e.preventDefault();
      if (!OWN_SOUND.has(el.dataset.act)) SND.play(el.dataset.act === 'step' ? (Number(el.dataset.arg) > 0 ? 'step' : 'stepDown') : 'tap');
      f(el.dataset.arg, el, e);
    }
  });
  app.addEventListener('input', (e) => {
    const i = e.target.dataset && e.target.dataset.name;
    if (i != null) { S.names[Number(i)] = e.target.value; SND.play('key'); const err = document.getElementById('names-err'); if (err) err.textContent = ''; }
    const ci = e.target.dataset && e.target.dataset.cname;
    if (ci != null) { S.names[Number(ci)] = e.target.value; SND.play('key'); const err = document.getElementById('cnames-err'); if (err) err.textContent = ''; }
    const cc = e.target.dataset && e.target.dataset.ccase;
    if (cc && S.cCase) S.cCase[cc] = e.target.value;
    const mc = e.target.dataset && e.target.dataset.mpcase;
    if (mc && MP.H && MP.H.case) MP.H.case[mc] = e.target.value;
    const mj = e.target.dataset && e.target.dataset.mpjoin;
    if (mj) MP.join[mj] = e.target.value;
    // online rooms: the create form, the join form (a pasted invite in the code field leaves just the code), the browser's search
    const oc = e.target.dataset && e.target.dataset.olc;
    if (oc) MP.olc[oc] = e.target.value;
    const oj = e.target.dataset && e.target.dataset.oljoin;
    if (oj) {
      MP.olj[oj] = e.target.value;
      if (oj === 'code' && e.target.value.length > 7) {
        const code = olFindCode(e.target.value);
        if (code) {
          e.target.value = MP.olj.code = code;
          const n = document.getElementById('ol-name');
          if (n && !n.value.trim()) n.focus();
          toast('تمام، أخدت الكود من الرسالة. اكتب اسمك ودوس «ادخل».');
        }
      }
    }
    if (e.target.dataset && e.target.dataset.olq) { MP.olq = e.target.value; olbPaint(); }
    if (e.target.dataset && e.target.dataset.news) MP.newsDraft = e.target.value;
    const sk = e.target.dataset && e.target.dataset.sugg;
    if (sk) {
      S.sugg = Object.assign({}, S.sugg || {}, { [sk]: e.target.value });
      const k = suggestCounts();
      const tc = document.getElementById('sg-title-c'), dc = document.getElementById('sg-desc-c'), btn = document.getElementById('sg-send');
      if (tc) { tc.textContent = k.title; tc.classList.toggle('ok', k.s.tOk); }
      if (dc) { dc.textContent = k.desc; dc.classList.toggle('ok', k.s.dOk); }
      if (btn) btn.disabled = !k.s.ok;
    }
  });
  app.addEventListener('keydown', (e) => {
    const i = e.target.dataset && e.target.dataset.name;
    if (i != null && e.key === 'Enter') {
      e.preventDefault();
      const nxt = document.getElementById(`name-${Number(i) + 1}`);
      if (nxt) nxt.focus(); else act.startGame();
    }
    if (e.key === 'Enter' && !e.isComposing && (e.target.id === 'mp-name' || e.target.id === 'mp-pin') && S.screen === 'mpJoin') {
      e.preventDefault();
      const p = document.getElementById('mp-pin');
      if (e.target.id === 'mp-name' && p && !p.value.trim()) p.focus(); else act.mpJoin();
    }
    if (e.key === 'Enter' && !e.isComposing && e.target.id === 'mp-hname' && S.screen === 'mpCreate') { e.preventDefault(); act.mpHost(MP.game === 'cases' ? 'cases' : 'court'); }
    // online forms: Enter goes to the next empty field, then presses the button
    if (e.key === 'Enter' && !e.isComposing && (S.screen === 'olCreate' || S.screen === 'olJoin') && /^ol-(hname|rname|pw|code|name)$/.test(e.target.id || '')) {
      e.preventDefault();
      const order = S.screen === 'olCreate' ? ['ol-hname', 'ol-rname', 'ol-pw'] : ['ol-code', 'ol-name', 'ol-pw'];
      const next = order.slice(order.indexOf(e.target.id) + 1).map((id) => document.getElementById(id)).find((el) => el && !el.value.trim() && !(S.screen === 'olCreate' && el.id === 'ol-rname'));
      if (next) next.focus(); else if (S.screen === 'olCreate') act.olHost(); else act.olJoin();
    }
  });
  // the in-app join (a hidden shortcut): a join link or the whole invite pasted into the name or PIN field
  // fills the PIN, and the room finder asks that link's address first
  app.addEventListener('paste', (e) => {
    if (S.screen !== 'mpJoin' || servedByRoom() || !/^mp-(name|pin)$/.test(e.target.id || '')) return;
    let text = '';
    try { text = (e.clipboardData || window.clipboardData).getData('text') || ''; } catch (err) { text = ''; }
    if (!/https?:\/\/|[?&]pin=/.test(text)) return;
    const L = parseRoomLink(text);
    if (!L) return;

    MP.join.addr = text;

  app.addEventListener('change', (e) => {
    if (e.target.dataset && e.target.dataset.sugg) { S.sugg = Object.assign({}, S.sugg || {}, { [e.target.dataset.sugg]: e.target.value }); return; }

  // back in the lobby after turning the hotspot / Wi-Fi on in the phone's settings: show the new join link
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && MP.role === 'host' && (S.screen === 'mcLobby' || S.screen === 'mpLobby') && roomRefreshIps()) render();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && NET.via === 'online') OL.wake();
  });
  window.addEventListener('online', () => { if (NET.via === 'online') OL.wake(); });
  // leaving the app mid-reveal hides the secret screen, so it never shows on return or in recent apps
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && S.mode === 'mc' && S.screen === 'mcPlay' && S.revealed && S.show !== false) { S.show = false; TIMES = false; render(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden' || !(S.players || S.cPlayers)) return;
    if (S.screen === 'role' && S.revealed) { S.revealed = false; TIMES = false; go('pass'); }
    else if (S.screen === 'cRole' && S.revealed) { S.revealed = false; go('cPass'); }
    else if (S.screen === 'reviewShow') go('night');
    else if (S.screen === 'vote') { S.choice = null; go('votePass'); }
  });

  // ---------- boot ----------
  function start(data) {
    S = (data && data.S && data.S.screen) ? data.S : { screen: 'modes' };
    // opened from a room link: the host's shared link (http://<host phone>/?join=1&pin=…&g=cases|court) lands on
    // a join screen with the PIN already in; the app's own join (…&name=…) joins right away
    let qs = null;
    try { qs = new URLSearchParams(location.search); } catch (e) { qs = null; }
    if (qs && qs.get('join') && servedByRoom()) {
      const g = ['cases', 'court'].includes(qs.get('g')) ? qs.get('g') : '';
      const pin = /^\d{4}$/.test(qs.get('pin') || '') ? qs.get('pin') : '';
      MP.join = { addr: '', name: (qs.get('name') || '').trim().slice(0, 18), pin, g };
      if (g) MP.game = g;
      S = { screen: 'mpJoin', mode: g === 'cases' ? 'mc' : 'mp' };
      render();
      if (MP.join.name && MP.join.pin) setTimeout(() => act.mpJoin(), 50);
      return;
    }
    render();
    flushOutbox().catch(() => { /* offline: suggestions stay queued */ });
  }
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S })); } catch (e) { /* no hot reload */ }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
